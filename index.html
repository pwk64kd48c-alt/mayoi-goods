<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迷子グッズ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  background:#fff;
  padding:20px 16px 14px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:22px;
  letter-spacing:.08em;
}

.top-nav{
  display:flex;
  gap:10px;
  padding:14px;
  background:#fff;
}

.top-nav button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px 5px;
  background:#e8e8e8;
  color:#555;
  font-weight:bold;
}

.top-nav button.active{
  background:#777;
  color:#fff;
}

main{
  max-width:700px;
  margin:0 auto;
  padding:15px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin:8px 0 14px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input[type="text"],
input[type="number"],
select,
textarea{
  width:100%;
  border:1px solid #ccc;
  border-radius:9px;
  padding:10px;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.form-group{
  margin-bottom:15px;
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#666;
  color:#fff;
  font-weight:bold;
}

.sub-btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#eee;
  color:#555;
}

.danger{
  background:#eee;
  color:#c55;
}

.image-preview{
  max-width:100%;
  max-height:260px;
  display:block;
  margin:10px auto 0;
  border-radius:8px;
  object-fit:contain;
}

.char-actions{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.char-actions button{
  flex:1;
}

.char-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.char-item{
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px;
  display:flex;
  align-items:center;
  gap:7px;
  background:#fafafa;
}

.char-item input{
  width:auto;
}

.char-item.selected{
  background:#eee;
  border-color:#999;
}

.char-detail{
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:12px;
}

.char-row{
  display:grid;
  grid-template-columns:1fr 75px 75px;
  gap:6px;
  align-items:center;
  margin-bottom:7px;
}

.char-row-name{
  font-weight:bold;
  font-size:14px;
}

.char-row input{
  padding:8px 5px;
  text-align:center;
}

.legend{
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}

.saved-item{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

.saved-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.saved-type{
  font-weight:bold;
}

.saved-buttons{
  display:flex;
  gap:5px;
}

.saved-buttons button{
  border:0;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  background:#eee;
}

.saved-preview{
  max-width:100%;
  max-height:150px;
  display:block;
  margin:10px auto;
  border-radius:7px;
}

.saved-chars{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.saved-chip{
  background:#f0f0f0;
  border-radius:20px;
  padding:4px 8px;
  font-size:12px;
}

.screenshot-box{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.ss-title{
  text-align:center;
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.ss-legend{
  text-align:center;
  font-size:11px;
  color:#777;
  margin-bottom:12px;
}

.ss-section{
  margin-bottom:15px;
}

.ss-type{
  font-weight:bold;
  font-size:14px;
  border-bottom:1px solid #ddd;
  padding-bottom:4px;
  margin-bottom:6px;
}

.ss-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:4px 15px;
}

.ss-char{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dotted #ddd;
  padding:4px 0;
  font-size:13px;
}

.retrade{
  margin-left:3px;
  font-size:11px;
}

.promise-row{
  display:grid;
  grid-template-columns:1fr 75px 75px 75px;
  gap:5px;
  align-items:center;
  margin-bottom:7px;
}

.promise-row input{
  padding:8px 4px;
  text-align:center;
}

.promise-head{
  display:grid;
  grid-template-columns:1fr 75px 75px 75px;
  gap:5px;
  font-size:11px;
  color:#888;
  margin-bottom:5px;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}

.back-btn{
  margin-bottom:12px;
}
</style>
</head>

<body>

<header>
  <h1>迷子グッズ</h1>
</header>

<div class="top-nav">
  <button id="navMayoi" class="active" onclick="showScreen('mayoi')">🧸 迷子</button>
  <button id="navPromise" onclick="showScreen('promise')">🤝 仮約束</button>
</div>

<main>

<!-- =========================
     迷子
========================= -->

<section id="mayoiScreen" class="screen active">

  <div id="mayoiHome">

    <div class="section-title">🧸 迷子</div>

    <button class="primary" onclick="openMayoiForm()">
      ＋ 迷子グッズを登録
    </button>

    <div style="height:12px"></div>

    <button class="sub-btn" style="width:100%" onclick="showMayoiScreenshot()">
      📸 スクショ用を見る
    </button>

    <div style="height:15px"></div>

    <div id="mayoiList"></div>

  </div>


  <div id="mayoiForm" style="display:none">

    <button class="sub-btn back-btn" onclick="closeMayoiForm()">
      ← 戻る
    </button>

    <div class="section-title" id="mayoiFormTitle">
      迷子グッズを登録
    </div>

    <div class="card">

      <div class="form-group">
        <label>グッズ種類</label>

        <select id="mayoiType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>
      </div>


      <div class="form-group">

        <label>グッズ画像</label>

        <input
          type="file"
          id="mayoiImage"
          accept="image/*"
          onchange="previewMayoiImage()"
        >

        <img
          id="mayoiImagePreview"
          class="image-preview"
          style="display:none"
        >

      </div>


      <div class="form-group">

        <label>キャラ名</label>

        <div class="legend">
          1行に1人ずつ入力してね
        </div>

        <textarea
          id="charNames"
          placeholder="レオ&#10;泉&#10;凛月&#10;司&#10;嵐"
        ></textarea>

      </div>


      <div class="form-group">

        <label>持っているキャラ</label>

        <div class="char-actions">
          <button class="sub-btn" onclick="selectAllChars()">
            ☑ 全員選択
          </button>

          <button class="sub-btn" onclick="clearAllChars()">
            □ 全解除
          </button>
        </div>

        <div id="charList" class="char-list"></div>

      </div>


      <div id="charDetail" class="char-detail"></div>


      <button class="primary" onclick="saveMayoi()">
        保存する
      </button>

    </div>

  </div>


  <div id="mayoiScreenshot" style="display:none">

    <button class="sub-btn back-btn" onclick="closeMayoiScreenshot()">
      ← 戻る
    </button>

    <div class="section-title">
      📸 スクショ用
    </div>

    <div id="mayoiScreenshotContent"></div>

  </div>

</section>


<!-- =========================
     仮約束
========================= -->

<section id="promiseScreen" class="screen">

  <div id="promiseHome">

    <div class="section-title">🤝 仮約束</div>

    <button class="primary" onclick="openPromiseForm()">
      ＋ 仮約束を登録
    </button>

    <div style="height:12px"></div>

    <button class="sub-btn" style="width:100%" onclick="showPromiseScreenshot()">
      📸 スクショ用を見る
    </button>

    <div style="height:15px"></div>

    <div id="promiseList"></div>

  </div>


  <div id="promiseForm" style="display:none">

    <button class="sub-btn back-btn" onclick="closePromiseForm()">
      ← 戻る
    </button>

    <div class="section-title" id="promiseFormTitle">
      仮約束を登録
    </div>

    <div class="card">

      <div class="form-group">

        <label>グッズ種類</label>

        <select id="promiseType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>

      </div>


      <div class="form-group">

        <label>キャラ名</label>

        <textarea
          id="promiseChars"
          placeholder="レオ&#10;泉&#10;凛月"
        ></textarea>

      </div>


      <div class="form-group">

        <label>数量</label>

        <div class="legend">
          所持数 → 仮約束数 → 残り
        </div>

        <div class="promise-head">
          <span>キャラ</span>
          <span>所持</span>
          <span>約束</span>
          <span>残り</span>
        </div>

        <div id="promiseDetail"></div>

      </div>


      <button class="primary" onclick="savePromise()">
        保存する
      </button>

    </div>

  </div>


  <div id="promiseScreenshot" style="display:none">

    <button class="sub-btn back-btn" onclick="closePromiseScreenshot()">
      ← 戻る
    </button>

    <div class="section-title">
      📸 スクショ用
    </div>

    <div id="promiseScreenshotContent"></div>

  </div>

</section>

</main>


<script>

const MAYOI_KEY = "mayoiGoodsData";
const PROMISE_KEY = "mayoiPromiseData";

let mayoiData =
  JSON.parse(localStorage.getItem(MAYOI_KEY) || "[]");

let promiseData =
  JSON.parse(localStorage.getItem(PROMISE_KEY) || "[]");

let editingMayoiId = null;
let editingPromiseId = null;


/* =========================
   共通
========================= */

function saveLocal(){
  localStorage.setItem(MAYOI_KEY, JSON.stringify(mayoiData));
  localStorage.setItem(PROMISE_KEY, JSON.stringify(promiseData));
}


function showScreen(type){

  document.getElementById("mayoiScreen").classList.remove("active");
  document.getElementById("promiseScreen").classList.remove("active");

  document.getElementById("navMayoi").classList.remove("active");
  document.getElementById("navPromise").classList.remove("active");

  if(type === "mayoi"){
    document.getElementById("mayoiScreen").classList.add("active");
    document.getElementById("navMayoi").classList.add("active");
    renderMayoiList();
  }else{
    document.getElementById("promiseScreen").classList.add("active");
    document.getElementById("navPromise").classList.add("active");
    renderPromiseList();
  }

}


/* =========================
   迷子
========================= */

function openMayoiForm(){

  editingMayoiId = null;

  document.getElementById("mayoiHome").style.display="none";
  document.getElementById("mayoiScreenshot").style.display="none";
  document.getElementById("mayoiForm").style.display="block";

  document.getElementById("mayoiFormTitle").textContent =
    "迷子グッズを登録";

  document.getElementById("mayoiType").value="ぱしゃっつ";

  document.getElementById("mayoiImage").value="";
  document.getElementById("mayoiImagePreview").style.display="none";

  document.getElementById("charNames").value="";
  document.getElementById("charList").innerHTML="";
  document.getElementById("charDetail").innerHTML="";
}


function closeMayoiForm(){

  document.getElementById("mayoiForm").style.display="none";
  document.getElementById("mayoiHome").style.display="block";

  renderMayoiList();
}


function previewMayoiImage(){

  const file =
    document.getElementById("mayoiImage").files[0];

  if(!file)return;

  const reader = new FileReader();

  reader.onload = function(e){

    const img =
      document.getElementById("mayoiImagePreview");

    img.src=e.target.result;
    img.style.display="block";

  };

  reader.readAsDataURL(file);
}


function makeCharList(){

  const names =
    document.getElementById("charNames")
      .value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

  const box =
    document.getElementById("charList");

  box.innerHTML="";

  names.forEach((name,i)=>{

    const div=document.createElement("label");

    div.className="char-item";

    div.innerHTML=`
      <input
        type="checkbox"
        class="char-check"
        data-name="${escapeHtml(name)}"
        onchange="updateCharDetail()"
      >
      <span>${escapeHtml(name)}</span>
    `;

    box.appendChild(div);

  });

}


document.getElementById("charNames")
  .addEventListener("input",makeCharList);


function selectAllChars(){

  document.querySelectorAll(".char-check")
    .forEach(x=>x.checked=true);

  updateCharDetail();
}


function clearAllChars(){

  document.querySelectorAll(".char-check")
    .forEach(x=>x.checked=false);

  updateCharDetail();
}


function updateCharDetail(){

  const checked =
    [...document.querySelectorAll(".char-check:checked")]
      .map(x=>x.dataset.name);

  const box =
    document.getElementById("charDetail");

  box.innerHTML="";

  checked.forEach(name=>{

    const old =
      editingMayoiId
      ? mayoiData.find(x=>x.id===editingMayoiId)
      : null;

    const oldChar =
      old?.characters?.find(x=>x.name===name);

    const qty=oldChar?.qty ?? 1;
    const retrade=oldChar?.retrade ?? 0;

    const row=document.createElement("div");

    row.className="char-row";

    row.innerHTML=`
      <div class="char-row-name">
        ${escapeHtml(name)}
      </div>

      <input
        type="number"
        min="0"
        value="${qty}"
        data-qty="${escapeHtml(name)}"
        placeholder="所持"
      >

      <input
        type="number"
        min="0"
        value="${retrade}"
        data-retrade="${escapeHtml(name)}"
        placeholder="再交換"
      >
    `;

    box.appendChild(row);

  });

}


function getSelectedChars(){

  return [...document.querySelectorAll(".char-check:checked")]
    .map(check=>{

      const name=check.dataset.name;

      const qtyInput =
        document.querySelector(`[data-qty="${cssEscape(name)}"]`);

      const retradeInput =
        document.querySelector(`[data-retrade="${cssEscape(name)}"]`);

      return {
        name:name,
        qty:Number(qtyInput?.value || 0),
        retrade:Number(retradeInput?.value || 0)
      };

    });

}


function saveMayoi(){

  const type =
    document.getElementById("mayoiType").value;

  const imagePreview =
    document.getElementById("mayoiImagePreview");

  const image =
    imagePreview.style.display !== "none"
      ? imagePreview.src
      : (
          editingMayoiId
          ? mayoiData.find(x=>x.id===editingMayoiId)?.image || ""
          : ""
        );

  const characters=getSelectedChars();

  if(characters.length===0){
    alert("持っているキャラを1人以上選んでね！");
    return;
  }

  const item={
    id:editingMayoiId || Date.now().toString(),
    type:type,
    image:image,
    characters:characters
  };

  if(editingMayoiId){

    const index =
      mayoiData.findIndex(x=>x.id===editingMayoiId);

    if(index!==-1){
      mayoiData[index]=item;
    }

  }else{

    mayoiData.push(item);

  }

  saveLocal();

  alert("保存したよ！");

  closeMayoiForm();
}


function renderMayoiList(){

  const box=document.getElementById("mayoiList");

  box.innerHTML="";

  if(mayoiData.length===0){

    box.innerHTML=
      `<div class="empty">まだ登録されてないよ</div>`;

    return;

  }

  mayoiData.forEach(item=>{

    const div=document.createElement("div");

    div.className="saved-item";

    const chars=item.characters
      .map(c=>`
        <span class="saved-chip">
          ${escapeHtml(c.name)}
          ${c.qty}
          ${c.retrade ? `⑩${c.retrade}` : ""}
        </span>
      `)
      .join("");

    div.innerHTML=`

      <div class="saved-head">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-buttons">

          <button onclick="editMayoi('${item.id}')">
            編集
          </button>

          <button
            class="danger"
            onclick="deleteMayoi('${item.id}')"
          >
            削除
          </button>

        </div>

      </div>

      ${
        item.image
        ? `<img src="${item.image}" class="saved-preview">`
        : ""
      }

      <div class="saved-chars">
        ${chars}
      </div>
    `;

    box.appendChild(div);

  });

}


function editMayoi(id){

  const item=mayoiData.find(x=>x.id===id);

  if(!item)return;

  editingMayoiId=id;

  document.getElementById("mayoiHome").style.display="none";
  document.getElementById("mayoiForm").style.display="block";

  document.getElementById("mayoiFormTitle").textContent =
    "迷子グッズを編集";

  document.getElementById("mayoiType").value=item.type;

  if(item.image){

    const img=
      document.getElementById("mayoiImagePreview");

    img.src=item.image;
    img.style.display="block";

  }

  document.getElementById("charNames").value =
    item.characters.map(x=>x.name).join("\n");

  makeCharList();

  document.querySelectorAll(".char-check")
    .forEach(check=>{

      if(item.characters.some(x=>x.name===check.dataset.name)){
        check.checked=true;
      }

    });

  updateCharDetail();
}


function deleteMayoi(id){

  if(!confirm("この迷子グッズを削除する？"))return;

  mayoiData=
    mayoiData.filter(x=>x.id!==id);

  saveLocal();

  renderMayoiList();
}


/* =========================
   迷子スクショ
========================= */

function showMayoiScreenshot(){

  document.getElementById("mayoiHome").style.display="none";
  document.getElementById("mayoiForm").style.display="none";
  document.getElementById("mayoiScreenshot").style.display="block";

  const box=
    document.getElementById("mayoiScreenshotContent");

  if(mayoiData.length===0){

    box.innerHTML=
      `<div class="empty">まだ登録がないよ</div>`;

    return;
  }

  let html=`

    <div class="screenshot-box">

      <div class="ss-title">
        迷子グッズ
      </div>

      <div class="ss-legend">
        ⑩＝再交換分
      </div>
  `;

  mayoiData.forEach(item=>{

    html+=`

      <div class="ss-section">

        <div class="ss-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="ss-grid">
    `;

    item.characters.forEach(c=>{

      html+=`

        <div class="ss-char">

          <span>
            ${escapeHtml(c.name)}
          </span>

          <span>
            ${c.qty}
            ${
              c.retrade
              ? `<span class="retrade">⑩${c.retrade}</span>`
              : ""
            }
          </span>

        </div>

      `;

    });

    html+=`

        </div>

      </div>
    `;

  });

  html+=`

    </div>
  `;

  box.innerHTML=html;
}


function closeMayoiScreenshot(){

  document.getElementById("mayoiScreenshot").style.display="none";
  document.getElementById("mayoiHome").style.display="block";

}


/* =========================
   仮約束
========================= */

function openPromiseForm(){

  editingPromiseId=null;

  document.getElementById("promiseHome").style.display="none";
  document.getElementById("promiseScreenshot").style.display="none";
  document.getElementById("promiseForm").style.display="block";

  document.getElementById("promiseFormTitle").textContent =
    "仮約束を登録";

  document.getElementById("promiseType").value="ぱしゃっつ";
  document.getElementById("promiseChars").value="";
  document.getElementById("promiseDetail").innerHTML="";
}


function closePromiseForm(){

  document.getElementById("promiseForm").style.display="none";
  document.getElementById("promiseHome").style.display="block";

  renderPromiseList();
}


document.getElementById("promiseChars")
  .addEventListener("input",makePromiseDetail);


function makePromiseDetail(){

  const names=
    document.getElementById("promiseChars")
      .value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

  const box=
    document.getElementById("promiseDetail");

  box.innerHTML="";

  names.forEach(name=>{

    const old=
      editingPromiseId
      ? promiseData.find(x=>x.id===editingPromiseId)
      : null;

    const oldChar=
      old?.characters?.find(x=>x.name===name);

    const qty=oldChar?.qty ?? 0;
    const promised=oldChar?.promised ?? 0;

    const row=document.createElement("div");

    row.className="promise-row";

    row.innerHTML=`

      <div class="char-row-name">
        ${escapeHtml(name)}
      </div>

      <input
        type="number"
        min="0"
        value="${qty}"
        data-pqty="${escapeHtml(name)}"
      >

      <input
        type="number"
        min="0"
        value="${promised}"
        data-ppromise="${escapeHtml(name)}"
        oninput="updatePromiseRemaining()"
      >

      <input
        type="number"
        value="${Math.max(0,qty-promised)}"
        data-premain="${escapeHtml(name)}"
        readonly
      >

    `;

    box.appendChild(row);

  });

}


function updatePromiseRemaining(){

  document.querySelectorAll("[data-ppromise]")
    .forEach(input=>{

      const name=input.dataset.ppromise;

      const qtyInput=
        document.querySelector(`[data-pqty="${cssEscape(name)}"]`);

      const remainInput=
        document.querySelector(`[data-premain="${cssEscape(name)}"]`);

      const qty=Number(qtyInput?.value||0);
      const promised=Number(input.value||0);

      if(remainInput){
        remainInput.value=Math.max(0,qty-promised);
      }

    });

}


function savePromise(){

  const type=
    document.getElementById("promiseType").value;

  const names=
    document.getElementById("promiseChars")
      .value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

  if(names.length===0){

    alert("キャラを1人以上入力してね！");
    return;

  }

  const characters=names.map(name=>{

    const qty=
      Number(
        document.querySelector(
          `[data-pqty="${cssEscape(name)}"]`
        )?.value || 0
      );

    const promised=
      Number(
        document.querySelector(
          `[data-ppromise="${cssEscape(name)}"]`
        )?.value || 0
      );

    return {
      name:name,
      qty:qty,
      promised:promised,
      remaining:Math.max(0,qty-promised)
    };

  });


  const item={
    id:editingPromiseId || Date.now().toString(),
    type:type,
    characters:characters
  };


  if(editingPromiseId){

    const index=
      promiseData.findIndex(x=>x.id===editingPromiseId);

    if(index!==-1){
      promiseData[index]=item;
    }

  }else{

    promiseData.push(item);

  }


  saveLocal();

  alert("保存したよ！");

  closePromiseForm();
}


function renderPromiseList(){

  const box=
    document.getElementById("promiseList");

  box.innerHTML="";

  if(promiseData.length===0){

    box.innerHTML=
      `<div class="empty">まだ登録されてないよ</div>`;

    return;

  }


  promiseData.forEach(item=>{

    const div=document.createElement("div");

    div.className="saved-item";

    let html=`

      <div class="saved-head">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-buttons">

          <button onclick="editPromise('${item.id}')">
            編集
          </button>

          <button
            class="danger"
            onclick="deletePromise('${item.id}')"
          >
            削除
          </button>

        </div>

      </div>

      <div style="margin-top:10px">
    `;


    item.characters.forEach(c=>{

      html+=`

        <div style="
          display:flex;
          justify-content:space-between;
          padding:6px 0;
          border-bottom:1px dotted #ddd;
        ">

          <span>${escapeHtml(c.name)}</span>

          <span>
            ${c.qty} →
            ${c.promised} →
            <b>${c.remaining}</b>
          </span>

        </div>

      `;

    });


    html+=`</div>`;

    div.innerHTML=html;

    box.appendChild(div);

  });

}


function editPromise(id){

  const item=
    promiseData.find(x=>x.id===id);

  if(!item)return;

  editingPromiseId=id;

  document.getElementById("promiseHome").style.display="none";
  document.getElementById("promiseForm").style.display="block";

  document.getElementById("promiseFormTitle").textContent =
    "仮約束を編集";

  document.getElementById("promiseType").value=item.type;

  document.getElementById("promiseChars").value =
    item.characters.map(x=>x.name).join("\n");

  makePromiseDetail();
}


function deletePromise(id){

  if(!confirm("この仮約束を削除する？"))return;

  promiseData=
    promiseData.filter(x=>x.id!==id);

  saveLocal();

  renderPromiseList();
}

function showPromiseScreenshot(){

  document.getElementById("promiseHome").style.display="none";

  document.getElementById("promiseScreenshot").style.display="block";

  const box=

    <div class="screenshot-box">

      </div>

  `;

function closePromiseScreenshot(){

  document.getElementById("promiseScreenshot").style.display="none";
  document.getElementById("promiseHome").style.display="block";

}


/* =========================
   XSS / CSS対策
========================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function cssEscape(str){

  if(window.CSS && CSS.escape){
    return CSS.escape(str);
  }

  return String(str).replace(/["\\]/g,"\\$&");
}
