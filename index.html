<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>迷子グッズメーカー</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Noto Sans JP",sans-serif;
}

header{
  padding:15px;
  border-bottom:1px solid #eee;
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  font-size:12px;
  color:#888;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.box{
  margin-bottom:12px;
  padding:14px;
  border:1px solid #eee;
  border-radius:14px;
  background:#fff;
}

button,
.file-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:9px;
  padding:9px 13px;
  background:#222;
  color:#fff;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
}

button.gray{
  background:#eee;
  color:#222;
}

input[type=file]{
  display:none;
}

.small{
  font-size:11px;
  color:#888;
  line-height:1.6;
}


/* =========================
   画像編集エリア
========================= */

#editorArea{
  display:none;
}

.editor-title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

#editor{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#f5f5f5;
  border-radius:8px;
  touch-action:none;
}

#editor img{
  display:block;
  width:100%;
  height:auto;
}

.crop-box{
  position:absolute;
  border:2px solid #222;
  background:rgba(255,255,255,.12);
  cursor:move;
  touch-action:none;
}

.crop-box.active{
  border-color:#ff4f91;
  background:rgba(255,79,145,.12);
}

.crop-number{
  position:absolute;
  top:-25px;
  left:0;
  background:#222;
  color:white;
  border-radius:5px;
  padding:3px 7px;
  font-size:11px;
}

.crop-delete{
  position:absolute;
  right:-12px;
  top:-12px;
  width:25px;
  height:25px;
  padding:0;
  border-radius:50%;
  background:white;
  color:#222;
  border:1px solid #aaa;
  font-size:15px;
}

.editor-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}


/* =========================
   グッズ一覧
========================= */

#goodsList{
  position:relative;
  width:100%;
  min-height:100px;
  background:#fff;
}


/*
  グッズはabsolute配置。
  これで元画像の位置関係を維持。
*/

.goods{
  position:absolute;
  text-align:center;
}

.goods-image{
  position:relative;
  width:100%;
  cursor:pointer;
}

.goods-image img{
  width:100%;
  height:auto;
  display:block;
  transition:opacity .2s;
}


/* 決定状態 */

.goods.done .goods-image img{
  opacity:.25;
}


/* 星 */

.goods-star{
  position:absolute;
  right:2px;
  top:0;
  font-size:22px;
  line-height:1;
  z-index:3;
  cursor:pointer;
  user-select:none;
}


/* 下の白いスペース */

.goods-info{
  background:#fff;
  min-height:48px;
  padding-top:3px;
}


/* 名前 */

.goods-name{
  width:100%;
  border:0;
  border-bottom:1px solid #ddd;
  text-align:center;
  font-size:11px;
  padding:3px 2px;
  outline:none;
  background:#fff;
}


/* 数量 */

.goods-quantity{
  width:45px;
  border:0;
  text-align:center;
  font-size:14px;
  padding:3px;
  outline:none;
  background:#fff;
}


/* 星色 */

.star-select{
  border:0;
  background:#fff;
  font-size:10px;
  margin-top:1px;
}


/* 削除 */

.goods-delete{
  position:absolute;
  left:-8px;
  top:-8px;
  width:23px;
  height:23px;
  border-radius:50%;
  border:1px solid #aaa;
  background:#fff;
  color:#222;
  padding:0;
  z-index:5;
}


/* =========================
   説明
========================= */

.legend-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.legend-row input[type=color]{
  width:35px;
  height:30px;
  padding:2px;
  border:1px solid #ccc;
  border-radius:6px;
}

.legend-row input[type=text]{
  flex:1;
  padding:7px;
  border:1px solid #ddd;
  border-radius:7px;
}


/* =========================
   スクショモード
========================= */

body.screenshot-mode header,
body.screenshot-mode .control-area{
  display:none;
}

body.screenshot-mode main{
  padding:0;
  max-width:none;
}

body.screenshot-mode .box{
  border:0;
  padding:0;
  margin:0;
}

body.screenshot-mode #goodsList{
  width:100%;
}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  main{
    padding:8px;
  }

  .box{
    padding:11px;
  }

  #goodsList{
    min-height:100px;
  }

}
</style>
</head>


<body>

<header>
  <h1>迷子グッズメーカー</h1>
  <p>グッズを並べて、交換用画像を作ろう！</p>
</header>


<main>

<!-- =========================
     操作
========================= -->

<section class="box control-area">

  <label class="file-btn">
    📷 画像を登録
    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >
  </label>

  <button
    class="gray"
    onclick="clearAll()"
  >
    リセット
  </button>

  <button
    class="gray"
    onclick="toggleScreenshot()"
  >
    📱 スクショ表示
  </button>

  <p
    id="status"
    class="small"
  >
    まず元になるグッズ画像を登録してね。
  </p>

</section>


<!-- =========================
     編集
========================= -->

<section
  id="editorArea"
  class="box control-area"
>

  <div class="editor-title">
    ✂️ グッズを切り出す
  </div>

  <div class="small">
    「グッズを追加」を押して、画像の上で切り出したい範囲を指定できます。<br>
    追加した枠はドラッグして位置を調整できます。
  </div>

  <div
    id="editor"
  >
    <img
      id="sourceImage"
    >
  </div>

  <div class="editor-buttons">

    <button onclick="addCrop()">
      ＋ グッズを追加
    </button>

    <button
      class="gray"
      onclick="finishEditing()"
    >
      ✓ グッズ一覧を作る
    </button>

  </div>

</section>


<!-- =========================
     星の説明
========================= -->

<section class="box control-area">

  <strong>⭐ 星の説明</strong>

  <div id="legend"></div>

  <button
    class="gray"
    onclick="addLegend()"
    style="margin-top:9px;"
  >
    ＋ 説明を追加
  </button>

</section>


<!-- =========================
     グッズ一覧
========================= -->

<section class="box">

  <div id="goodsList"></div>

</section>

</main>


<script>

/* =========================================================
   データ
========================================================= */

let sourceImageData = null;

let sourceImageWidth = 0;
let sourceImageHeight = 0;

let crops = [];

let goods = [];

let legends = [
  {
    color:"#f5b700",
    text:"交換優先"
  },
  {
    color:"#e91e63",
    text:"抱き合わせ希望"
  }
];


/* =========================================================
   画像登録
========================================================= */

document
.getElementById("imageInput")
.addEventListener("change",function(e){

  const file = e.target.files[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event){

    sourceImageData =
      event.target.result;

    const img =
      document.getElementById("sourceImage");

    img.onload = function(){

      sourceImageWidth =
        img.naturalWidth;

      sourceImageHeight =
        img.naturalHeight;

      document
        .getElementById("editorArea")
        .style.display = "block";

      document
        .getElementById("status")
        .textContent =
        "画像を登録したよ！「＋グッズを追加」で切り出してね。";

    };

    img.src =
      sourceImageData;

  };

  reader.readAsDataURL(file);

});


/* =========================================================
   グッズ切り出し枠追加
========================================================= */

function addCrop(){

  if(!sourceImageData){
    alert("先に画像を登録してね！");
    return;
  }

  /*
    最初は画像中央に小さめの枠を作る
  */

  const crop = {

    id:Date.now(),

    x:30,

    y:30,

    width:25,

    height:25

  };

  crops.push(crop);

  renderCrops();

}


/* =========================================================
   切り出し枠表示
========================================================= */

function renderCrops(){

  const editor =
    document.getElementById("editor");

  document
    .querySelectorAll(".crop-box")
    .forEach(el => el.remove());


  crops.forEach(function(crop,index){

    const box =
      document.createElement("div");

    box.className =
      "crop-box";

    box.style.left =
      crop.x + "%";

    box.style.top =
      crop.y + "%";

    box.style.width =
      crop.width + "%";

    box.style.height =
      crop.height + "%";


    const number =
      document.createElement("div");

    number.className =
      "crop-number";

    number.textContent =
      index + 1;


    const del =
      document.createElement("button");

    del.className =
      "crop-delete";

    del.textContent =
      "×";


    del.onclick =
      function(e){

        e.stopPropagation();

        crops =
          crops.filter(
            x => x.id !== crop.id
          );

        renderCrops();

      };


    box.appendChild(number);

    box.appendChild(del);

    editor.appendChild(box);


    /* -------------------------
       ドラッグ
    ------------------------- */

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;


    box.addEventListener(
      "pointerdown",
      function(e){

        if(
          e.target === del
        ){
          return;
        }

        dragging = true;

        startX = e.clientX;
        startY = e.clientY;

        startLeft = crop.x;
        startTop = crop.y;

        box.classList.add("active");

        box.setPointerCapture(
          e.pointerId
        );

      }
    );


    box.addEventListener(
      "pointermove",
      function(e){

        if(!dragging){
          return;
        }

        const rect =
          editor.getBoundingClientRect();

        const dx =
          (e.clientX - startX)
          / rect.width * 100;

        const dy =
          (e.clientY - startY)
          / rect.height * 100;


        crop.x =
          Math.max(
            0,
            Math.min(
              100 - crop.width,
              startLeft + dx
            )
          );

        crop.y =
          Math.max(
            0,
            Math.min(
              100 - crop.height,
              startTop + dy
            )
          );


        box.style.left =
          crop.x + "%";

        box.style.top =
          crop.y + "%";

      }
    );


    box.addEventListener(
      "pointerup",
      function(){

        dragging = false;

        box.classList.remove(
          "active"
        );

      }
    );

  });

}


/* =========================================================
   一覧作成
========================================================= */

function finishEditing(){

  if(crops.length === 0){

    alert("まずグッズを1個以上追加してね！");

    return;

  }


  goods = crops.map(
    function(crop,index){

      return {

        id:crop.id,

        x:crop.x,

        y:crop.y,

        width:crop.width,

        height:crop.height,

        name:"",

        quantity:"",

        starColor:"#f5b700",

        done:false

      };

    }
  );


  document
    .getElementById("editorArea")
    .style.display = "none";


  renderGoods();

  saveData();

}


/* =========================================================
   グッズ一覧表示
========================================================= */

function renderGoods(){

  const list =
    document.getElementById("goodsList");

  list.innerHTML = "";


  if(goods.length === 0){

    list.innerHTML =
      '<div class="small" style="padding:30px;text-align:center;">グッズがありません</div>';

    return;

  }


  /*
    元画像の比率を使って
    一覧エリアの高さを決める
  */

  const ratio =
    sourceImageHeight /
    sourceImageWidth;


  const listWidth =
    list.clientWidth ||
    350;


  list.style.height =
    (listWidth * ratio) + "px";


  goods.forEach(
    function(item){

      createGood(item);

    }
  );

}


/* =========================================================
   グッズ1個
========================================================= */

function createGood(item){

  const list =
    document.getElementById("goodsList");


  const good =
    document.createElement("div");

  good.className =
    "goods";


  /*
    元画像上の位置をそのまま使用
  */

  good.style.left =
    item.x + "%";

  good.style.top =
    item.y + "%";

  good.style.width =
    item.width + "%";


  if(item.done){
    good.classList.add("done");
  }


  /* =========================
     画像
  ========================= */

  const image =
    document.createElement("div");

  image.className =
    "goods-image";


  const img =
    document.createElement("img");

  img.src =
    sourceImageData;


  /*
    元画像から指定範囲だけ表示
  */

  img.style.width =
    (100 / item.width) + "%";

  img.style.maxWidth =
    "none";


  img.style.position =
    "absolute";


  img.style.left =
    -(item.x / item.width * 100) + "%";

  img.style.top =
    -(item.y / item.height * 100) + "%";


  /*
    切り出し部分の縦横比
  */

  image.style.aspectRatio =
    item.width + " / " + item.height;


  image.style.overflow =
    "hidden";


  /*
    タップで薄くする
  */

  image.addEventListener(
    "click",
    function(){

      item.done =
        !item.done;

      good.classList.toggle(
        "done",
        item.done
      );

      saveData();

    }
  );


  /* =========================
     星
  ========================= */

  const star =
    document.createElement("div");

  star.className =
    "goods-star";

  star.textContent =
    "★";

  star.style.color =
    item.starColor;


  star.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

    }
  );


  /* =========================
     削除
  ========================= */

  const deleteBtn =
    document.createElement("button");

  deleteBtn.className =
    "goods-delete";

  deleteBtn.textContent =
    "×";


  deleteBtn.onclick =
    function(e){

      e.stopPropagation();

      goods =
        goods.filter(
          x => x.id !== item.id
        );

      renderGoods();

      saveData();

    };


  image.appendChild(img);

  image.appendChild(star);

  image.appendChild(deleteBtn);


  /* =========================
     下の白いスペース
  ========================= */

  const info =
    document.createElement("div");

  info.className =
    "goods-info";


  /* 名前 */

  const name =
    document.createElement("input");

  name.className =
    "goods-name";

  name.placeholder =
    "グッズ名";

  name.value =
    item.name;


  name.addEventListener(
    "input",
    function(){

      item.name =
        name.value;

      saveData();

    }
  );


  /* 数量 */

  const quantity =
    document.createElement("input");

  quantity.className =
    "goods-quantity";

  quantity.type =
    "number";

  quantity.min =
    "0";

  quantity.placeholder =
    "数量";

  quantity.value =
    item.quantity;


  quantity.addEventListener(
    "input",
    function(){

      item.quantity =
        quantity.value;

      saveData();

    }
  );


  /* 星色 */

  const starSelect =
    document.createElement("select");

  starSelect.className =
    "star-select";


  const starColors = [

    ["#f5b700","💛"],

    ["#e91e63","🩷"],

    ["#35a9e0","🩵"],

    ["#65b96b","💚"],

    ["#9b59b6","💜"],

    ["#aaa","☆"]

  ];


  starColors.forEach(
    function(data){

      const option =
        document.createElement("option");

      option.value =
        data[0];

      option.textContent =
        data[1];

      if(
        data[0] === item.starColor
      ){
        option.selected = true;
      }

      starSelect.appendChild(
        option
      );

    }
  );


  starSelect.addEventListener(
    "change",
    function(){

      item.starColor =
        starSelect.value;

      star.style.color =
        item.starColor;

      saveData();

    }
  );


  info.appendChild(name);

  info.appendChild(quantity);

  info.appendChild(starSelect);


  good.appendChild(image);

  good.appendChild(info);


  list.appendChild(good);

}


/* =========================================================
   星の説明
========================================================= */

function renderLegend(){

  const area =
    document.getElementById("legend");

  area.innerHTML = "";


  legends.forEach(
    function(item,index){

      const row =
        document.createElement("div");

      row.className =
        "legend-row";


      const color =
        document.createElement("input");

      color.type =
        "color";

      color.value =
        item.color;


      color.addEventListener(
        "input",
        function(){

          item.color =
            color.value;

          renderGoods();

          renderLegend();

          saveData();

        }
      );


      const text =
        document.createElement("input");

      text.type =
        "text";

      text.placeholder =
        "例：交換優先";

      text.value =
        item.text;


      text.addEventListener(
        "input",
        function(){

          item.text =
            text.value;

          saveData();

        }
      );


      const del =
        document.createElement("button");

      del.className =
        "gray";

      del.textContent =
        "×";


      del.onclick =
        function(){

          legends.splice(
            index,
            1
          );

          renderLegend();

          saveData();

        };


      row.appendChild(color);

      row.appendChild(text);

      row.appendChild(del);

      area.appendChild(row);

    }
  );

}


function addLegend(){

  legends.push({
    color:"#000000",
    text:""
  });

  renderLegend();

  saveData();

}


/* =========================================================
   スクショモード
========================================================= */

function toggleScreenshot(){

  document.body.classList.toggle(
    "screenshot-mode"
  );

  /*
    表示サイズが変わるので再計算
  */

  setTimeout(
    function(){

      renderGoods();

    },
    50
  );

}


/* =========================================================
   リセット
========================================================= */

function clearAll(){

  if(
    !confirm(
      "全部リセットする？"
    )
  ){
    return;
  }


  sourceImageData = null;

  crops = [];

  goods = [];


  localStorage.removeItem(
    "mayoiGoodsData"
  );


  document
    .getElementById("grid");


  document
    .getElementById("editorArea")
    .style.display = "none";


  document
    .getElementById("goodsList")
    .innerHTML = "";


  document
    .getElementById("status")
    .textContent =
    "まず元になるグッズ画像を登録してね。";


  document
    .getElementById("imageInput")
    .value = "";

}


/* =========================================================
   保存
========================================================= */

function saveData(){

  try{

    localStorage.setItem(
      "mayoiGoodsData",
      JSON.stringify({

        sourceImageData,

        sourceImageWidth,

        sourceImageHeight,

        crops,

        goods,

        legends

      })
    );

  }catch(e){

    console.log(
      "保存できませんでした",
      e
    );

  }

}


/* =========================================================
   読み込み
========================================================= */

window.addEventListener(
"load",
function(){

  renderLegend();


  try{

    const saved =
      localStorage.getItem(
        "mayoiGoodsData"
      );


    if(!saved){
      return;
    }


    const data =
      JSON.parse(saved);


    if(data.sourceImageData){

      sourceImageData =
        data.sourceImageData;

      sourceImageWidth =
        data.sourceImageWidth;

      sourceImageHeight =
        data.sourceImageHeight;

      crops =
        data.crops || [];

      goods =
        data.goods || [];

      legends =
        data.legends || legends;


      document
        .getElementById("status")
        .textContent =
        "前回のデータを読み込みました。";


      renderLegend();


      if(
        goods.length > 0
      ){

        renderGoods();

      }

    }

  }catch(e){

    console.log(
      "読み込みエラー",
      e
    );

  }

});


/* =========================================================
   画面サイズ変更
========================================================= */

window.addEventListener(
"resize",
function(){

  if(
    goods.length > 0
  ){
    renderGoods();
  }

});

</script>

</body>
</html>
