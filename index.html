<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>迷子グッズメーカー</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f6f6;
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

header{
  background:#fff;
  padding:18px 16px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:100;
}

header h1{
  margin:0 0 6px;
  font-size:20px;
}

header p{
  margin:0;
  color:#777;
  font-size:13px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

button,
input,
select{
  font:inherit;
}

button{
  border:1px solid #ccc;
  background:#fff;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

button:hover{
  background:#f0f0f0;
}

.primary{
  background:#333;
  color:#fff;
  border-color:#333;
}

.primary:hover{
  background:#222;
}

.danger{
  color:#d33;
}

.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}

.panel h2{
  margin:0 0 12px;
  font-size:16px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.file-label{
  display:inline-block;
  padding:9px 13px;
  background:#333;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

.file-label input{
  display:none;
}

.status{
  font-size:13px;
  color:#666;
  margin-top:10px;
}

#sourceArea{
  display:none;
}

.source-wrap{
  position:relative;
  max-width:100%;
  overflow:auto;
  background:#eee;
  border-radius:8px;
  padding:10px;
}

#sourceCanvas{
  display:block;
  max-width:100%;
  height:auto;
  background:#fff;
}

#detectOverlay{
  position:absolute;
  left:10px;
  top:10px;
  pointer-events:none;
}

.detect-box{
  position:absolute;
  border:2px solid #35a853;
  background:rgba(52,168,83,.08);
  border-radius:4px;
}

.detect-number{
  position:absolute;
  left:-2px;
  top:-22px;
  background:#35a853;
  color:#fff;
  font-size:11px;
  padding:2px 6px;
  border-radius:4px 4px 4px 0;
}

#previewPanel{
  display:none;
}

.preview-scroll{
  width:100%;
  overflow:auto;
  background:#eee;
  padding:10px;
  border-radius:10px;
}

#goodsCanvas{
  position:relative;
  background:#fff;
  margin:0 auto;
  overflow:hidden;
}

.goods{
  position:absolute;
  overflow:visible;
}

.goods-image-wrap{
  position:relative;
  width:100%;
}

.goods-image{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
  cursor:pointer;
  transition:opacity .2s;
}

.goods.done .goods-image{
  opacity:.28;
}

.star{
  position:absolute;
  right:3px;
  top:3px;
  width:30px;
  height:30px;
  padding:0;
  border:0;
  background:rgba(255,255,255,.9);
  border-radius:50%;
  font-size:21px;
  line-height:30px;
  z-index:5;
}

.delete-item{
  position:absolute;
  left:3px;
  top:3px;
  width:26px;
  height:26px;
  padding:0;
  border:0;
  background:rgba(255,255,255,.95);
  color:#d33;
  border-radius:50%;
  z-index:5;
  font-size:16px;
}

.goods-info{
  width:100%;
  background:#fff;
  border:1px solid #eee;
  border-radius:0 0 5px 5px;
  padding:5px;
  overflow:hidden;
}

.quantity-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.quantity-mark{
  font-size:13px;
}

.quantity-input{
  width:42px;
  border:0;
  border-bottom:1px solid #aaa;
  text-align:center;
  padding:2px;
  background:transparent;
}

.goods-name,
.goods-memo{
  width:100%;
  border:0;
  border-bottom:1px solid #ddd;
  padding:3px 2px;
  font-size:11px;
  outline:none;
  background:transparent;
}

.goods-memo{
  color:#777;
}

.edit-tools{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:3px;
}

.star-color{
  font-size:10px;
  padding:2px;
  max-width:100%;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
}

.legend-star{
  font-size:18px;
}

.legend-editor{
  display:grid;
  gap:7px;
}

.legend-line{
  display:flex;
  gap:7px;
  align-items:center;
}

.legend-line input[type="text"]{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:6px;
  padding:6px;
}

.color-input{
  width:42px;
  height:32px;
  padding:1px;
}

.small{
  font-size:12px;
  color:#777;
}

#emptyMessage{
  text-align:center;
  padding:40px 10px;
  color:#999;
}

.screenshot-mode header,
.screenshot-mode .editor-only,
.screenshot-mode #sourceArea,
.screenshot-mode #settingsPanel,
.screenshot-mode #previewControls{
  display:none !important;
}

.screenshot-mode main{
  padding:10px;
  max-width:none;
}

.screenshot-mode .panel{
  border:0;
  padding:0;
  margin:0;
}

.screenshot-mode .preview-scroll{
  padding:0;
  background:#fff;
  overflow:visible;
}

.screenshot-mode .delete-item,
.screenshot-mode .edit-tools{
  display:none !important;
}

.screenshot-mode .goods-info{
  border:0;
}

.screenshot-mode input{
  pointer-events:none;
  border:0;
}

@media(max-width:600px){
  header h1{
    font-size:18px;
  }

  main{
    padding:10px;
  }

  .panel{
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <h1>迷子グッズメーカー</h1>
  <p>画像からグッズを自動で切り分けます</p>
</header>

<main>

  <!-- アップロード -->
  <section class="panel editor-only">
    <h2>① 画像を選ぶ</h2>

    <div class="row">
      <label class="file-label">
        画像をアップロード
        <input type="file" id="imageInput" accept="image/*">
      </label>

      <button id="detectBtn" class="primary" disabled>
        グッズを自動検出
      </button>
    </div>

    <div id="status" class="status">
      画像を選択してください
    </div>
  </section>


  <!-- 自動検出結果 -->
  <section id="sourceArea" class="panel editor-only">

    <h2>② 自動検出結果</h2>

    <div class="row">
      <button id="redetectBtn" class="primary">
        もう一度自動検出
      </button>

      <button id="addAllBtn">
        検出したものを全部採用
      </button>

      <button id="clearSelectedBtn" class="danger">
        採用を全部解除
      </button>
    </div>

    <p class="small">
      緑の枠が自動検出されたグッズです。不要なものは下の一覧から削除できます。
    </p>

    <div class="source-wrap">
      <canvas id="sourceCanvas"></canvas>
      <div id="detectOverlay"></div>
    </div>

  </section>


  <!-- プレビュー -->
  <section id="previewPanel" class="panel">

    <div id="previewControls" class="editor-only">

      <h2>③ 完成イメージ</h2>

      <div class="row">
        <button id="screenshotBtn" class="primary">
          スクショ用表示
        </button>

        <button id="resetBtn" class="danger">
          全部リセット
        </button>
      </div>

      <p class="small">
        グッズ画像をタップすると決定済み表示になります。
        ⭐をタップすると色が変わります。
      </p>

    </div>

    <div class="preview-scroll">
      <div id="goodsCanvas">
        <div id="emptyMessage">
          グッズを検出するとここに表示されます
        </div>
      </div>
    </div>

    <div id="legend" class="legend"></div>

  </section>


  <!-- 設定 -->
  <section id="settingsPanel" class="panel editor-only">

    <h2>表示設定</h2>

    <div class="row">
      <label>
        グッズ下の空白
        <input
          id="blankHeight"
          type="number"
          min="30"
          max="150"
          value="65"
          style="width:70px"
        >
        px
      </label>
    </div>

    <hr>

    <h2>⭐ 星の説明</h2>

    <div class="legend-editor">

      <div class="legend-line">
        <input
          class="color-input"
          type="color"
          id="legendColor0"
          value="#FFD43B"
        >

        <span>⭐</span>

        <input
          type="text"
          id="legendText0"
          value="交換優先"
        >
      </div>


      <div class="legend-line">
        <input
          class="color-input"
          type="color"
          id="legendColor1"
          value="#FF8FB3"
        >

        <span>⭐</span>

        <input
          type="text"
          id="legendText1"
          value="抱き合わせ希望"
        >
      </div>


      <div class="legend-line">
        <input
          class="color-input"
          type="color"
          id="legendColor2"
          value="#9AA0A6"
        >

        <span>⭐</span>

        <input
          type="text"
          id="legendText2"
          value="通常"
        >
      </div>

    </div>

  </section>

</main>


<script>

const imageInput = document.getElementById("imageInput");
const detectBtn = document.getElementById("detectBtn");
const redetectBtn = document.getElementById("redetectBtn");
const addAllBtn = document.getElementById("addAllBtn");
const clearSelectedBtn = document.getElementById("clearSelectedBtn");

const sourceArea = document.getElementById("sourceArea");
const sourceCanvas = document.getElementById("sourceCanvas");
const sourceCtx = sourceCanvas.getContext("2d");

const detectOverlay = document.getElementById("detectOverlay");

const previewPanel = document.getElementById("previewPanel");
const goodsCanvas = document.getElementById("goodsCanvas");
const emptyMessage = document.getElementById("emptyMessage");

const statusEl = document.getElementById("status");

const blankHeightInput = document.getElementById("blankHeight");

const screenshotBtn = document.getElementById("screenshotBtn");
const resetBtn = document.getElementById("resetBtn");

let originalImage = null;

let sourceWidth = 0;
let sourceHeight = 0;

let detectedItems = [];
let items = [];

let itemId = 1;

let screenshotMode = false;

const starColors = [
  "#FFD43B",
  "#FF8FB3",
  "#9AA0A6",
  "#7CC7FF",
  "#B98CFF"
];


/* =========================
   画像読み込み
========================= */

imageInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      originalImage = img;

      sourceWidth = img.naturalWidth;
      sourceHeight = img.naturalHeight;

      sourceCanvas.width = sourceWidth;
      sourceCanvas.height = sourceHeight;

      sourceCtx.clearRect(
        0,
        0,
        sourceWidth,
        sourceHeight
      );

      sourceCtx.drawImage(
        img,
        0,
        0
      );

      sourceArea.style.display = "block";

      detectBtn.disabled = false;

      statusEl.textContent =
        "画像を読み込みました。自動検出を押してください。";

      detectItems();

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(file);

});


detectBtn.addEventListener("click", detectItems);
redetectBtn.addEventListener("click", detectItems);


/* =========================
   自動検出
========================= */

function detectItems(){

  if(!originalImage) return;

  statusEl.textContent = "グッズを自動検出中…";

  detectedItems = [];

  const scale = Math.min(
    1,
    1100 / sourceWidth
  );

  const w = Math.max(
    1,
    Math.round(sourceWidth * scale)
  );

  const h = Math.max(
    1,
    Math.round(sourceHeight * scale)
  );


  const tempCanvas = document.createElement("canvas");

  tempCanvas.width = w;
  tempCanvas.height = h;

  const ctx = tempCanvas.getContext("2d");

  ctx.drawImage(
    originalImage,
    0,
    0,
    w,
    h
  );


  const imageData = ctx.getImageData(
    0,
    0,
    w,
    h
  );

  const data = imageData.data;

  const mask = new Uint8Array(w * h);


  /*
    白背景ではなく、

    ・暗い色
    ・色のついた部分
    ・薄い枠線

    を検出
  */

  for(let y=0; y<h; y++){

    for(let x=0; x<w; x++){

      const i = (y*w+x)*4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];

      const max = Math.max(r,g,b);
      const min = Math.min(r,g,b);

      const brightness =
        (r+g+b)/3;

      const saturation =
        max-min;

      if(
        brightness < 244 ||
        saturation > 18
      ){
        mask[y*w+x] = 1;
      }

    }

  }


  /*
    少し膨張させる。

    カード内の画像・文字・枠を
    ひとつにつなげやすくする。
  */

  const dilated = dilateMask(
    mask,
    w,
    h,
    4
  );


  /*
    連結成分を探す
  */

  const visited = new Uint8Array(
    w*h
  );

  const components = [];


  for(let y=0; y<h; y++){

    for(let x=0; x<w; x++){

      const index = y*w+x;

      if(
        !dilated[index] ||
        visited[index]
      ){
        continue;
      }


      const queue = [index];

      visited[index] = 1;

      let minX = x;
      let maxX = x;
      let minY = y;
      let maxY = y;

      let count = 0;


      while(queue.length){

        const current = queue.pop();

        const cy =
          Math.floor(current/w);

        const cx =
          current - cy*w;

        count++;


        minX = Math.min(minX,cx);
        maxX = Math.max(maxX,cx);

        minY = Math.min(minY,cy);
        maxY = Math.max(maxY,cy);


        const neighbors = [

          current-1,
          current+1,
          current-w,
          current+w

        ];


        for(const n of neighbors){

          if(
            n < 0 ||
            n >= w*h ||
            visited[n] ||
            !dilated[n]
          ){
            continue;
          }

          /*
            左右端をまたぐのを防ぐ
          */

          if(
            Math.abs(
              (n%w)-(current%w)
            ) > 1
          ){
            continue;
          }

          visited[n] = 1;

          queue.push(n);

        }

      }


      const bw = maxX-minX+1;
      const bh = maxY-minY+1;
      const area = bw*bh;

      /*
        小さすぎるノイズを除外
      */

      if(
        area > w*h*0.00025 &&
        bw > 25 &&
        bh > 35
      ){

        components.push({
          x:minX,
          y:minY,
          w:bw,
          h:bh,
          area,
          pixels:count
        });

      }

    }

  }


  /*
    カード候補を整理
  */

  let candidates =
    mergeNearbyComponents(
      components,
      w,
      h
    );


  /*
    大きすぎる領域は除外。
    今回のようなカード画像なら
    だいたい縦長になる。
  */

  candidates =
    candidates.filter(c => {

      const ratio =
        c.w/c.h;

      const areaRatio =
        (c.w*c.h)/(w*h);

      if(areaRatio > 0.18){
        return false;
      }

      if(c.w < 35 || c.h < 45){
        return false;
      }

      if(ratio > 2.2){
        return false;
      }

      return true;

    });


  /*
    重複した候補を整理
  */

  candidates =
    removeNestedBoxes(
      candidates
    );


  /*
    元画像サイズに戻す
  */

  const sx =
    sourceWidth/w;

  const sy =
    sourceHeight/h;


  detectedItems =
    candidates.map(c => {

      const padX =
        Math.max(
          5,
          Math.round(c.w*0.06)
        );

      const padY =
        Math.max(
          5,
          Math.round(c.h*0.04)
        );


      let x =
        Math.max(
          0,
          c.x-padX
        );

      let y =
        Math.max(
          0,
          c.y-padY
        );

      let right =
        Math.min(
          w,
          c.x+c.w+padX
        );

      let bottom =
        Math.min(
          h,
          c.y+c.h+padY
        );


      return {

        x:Math.round(x*sx),
        y:Math.round(y*sy),

        w:Math.round(
          (right-x)*sx
        ),

        h:Math.round(
          (bottom-y)*sy
        )

      };

    });


  /*
    大きい順ではなく
    上→下、左→右
  */

  detectedItems.sort((a,b)=>{

    const tolerance =
      Math.min(a.h,b.h)*0.45;

    if(
      Math.abs(a.y-b.y) < tolerance
    ){
      return a.x-b.x;
    }

    return a.y-b.y;

  });


  drawDetectionOverlay();

  statusEl.textContent =
    `自動検出：${detectedItems.length}個`;

}


/* =========================
   マスク膨張
========================= */

function dilateMask(
  mask,
  w,
  h,
  radius
){

  const output =
    new Uint8Array(w*h);

  for(let y=0; y<h; y++){

    for(let x=0; x<w; x++){

      let found = false;

      for(
        let dy=-radius;
        dy<=radius && !found;
        dy++
      ){

        const yy=y+dy;

        if(
          yy<0 ||
          yy>=h
        ){
          continue;
        }

        for(
          let dx=-radius;
          dx<=radius;
          dx++
        ){

          const xx=x+dx;

          if(
            xx<0 ||
            xx>=w
          ){
            continue;
          }

          if(
            mask[yy*w+xx]
          ){

            found=true;
            break;

          }

        }

      }

      if(found){
        output[y*w+x]=1;
      }

    }

  }

  return output;

}


/* =========================
   近い成分を結合
========================= */

function mergeNearbyComponents(
  components,
  w,
  h
){

  const result =
    components.map(c=>({...c}));

  let changed = true;


  while(changed){

    changed=false;

    outer:

    for(let i=0;i<result.length;i++){

      for(let j=i+1;j<result.length;j++){

        const a=result[i];
        const b=result[j];


        const ax2=a.x+a.w;
        const ay2=a.y+a.h;

        const bx2=b.x+b.w;
        const by2=b.y+b.h;


        const gapX =
          Math.max(
            0,
            Math.max(
              a.x-bx2,
              b.x-ax2
            )
          );

        const gapY =
          Math.max(
            0,
            Math.max(
              a.y-by2,
              b.y-ay2
            )
          );


        /*
          同じカード内部の
          画像・文字・枠をまとめる。

          ただしカード同士は
          離れているので結合しない。
        */

        const nearX =
          gapX < Math.max(
            8,
            Math.min(a.w,b.w)*0.12
          );

        const nearY =
          gapY < Math.max(
            8,
            Math.min(a.h,b.h)*0.12
          );


        const overlapX =
          Math.min(ax2,bx2)-
          Math.max(a.x,b.x);

        const overlapY =
          Math.min(ay2,by2)-
          Math.max(a.y,b.y);


        const sameRegion =
          (
            nearX &&
            overlapY > 0
          ) ||
          (
            nearY &&
            overlapX > 0
          );


        if(sameRegion){

          const nx =
            Math.min(a.x,b.x);

          const ny =
            Math.min(a.y,b.y);

          const nr =
            Math.max(ax2,bx2);

          const nb =
            Math.max(ay2,by2);


          result[i]={
            x:nx,
            y:ny,
            w:nr-nx,
            h:nb-ny,
            area:(nr-nx)*(nb-ny),
            pixels:a.pixels+b.pixels
          };

          result.splice(j,1);

          changed=true;

          break outer;

        }

      }

    }

  }


  return result;

}


/* =========================
   内包された箱を削除
========================= */

function removeNestedBoxes(
  boxes
){

  return boxes.filter(
    (box,i)=>{

      for(let j=0;j<boxes.length;j++){

        if(i===j) continue;

        const other=boxes[j];

        const inside =
          box.x >= other.x &&
          box.y >= other.y &&
          box.x+box.w <=
            other.x+other.w &&
          box.y+box.h <=
            other.y+other.h;


        if(
          inside &&
          other.w*other.h >
            box.w*box.h*1.25
        ){

          return false;

        }

      }

      return true;

    }
  );

}


/* =========================
   検出結果表示
========================= */

function drawDetectionOverlay(){

  detectOverlay.innerHTML="";

  const displayedWidth =
    sourceCanvas.clientWidth ||
    sourceCanvas.width;

  const displayedHeight =
    sourceCanvas.clientHeight ||
    sourceCanvas.height;


  const scaleX =
    displayedWidth/sourceWidth;

  const scaleY =
    displayedHeight/sourceHeight;


  detectOverlay.style.width =
    displayedWidth+"px";

  detectOverlay.style.height =
    displayedHeight+"px";


  detectedItems.forEach(
    (item,index)=>{

      const box =
        document.createElement("div");

      box.className="detect-box";

      box.style.left =
        item.x*scaleX+"px";

      box.style.top =
        item.y*scaleY+"px";

      box.style.width =
        item.w*scaleX+"px";

      box.style.height =
        item.h*scaleY+"px";


      const number =
        document.createElement("div");

      number.className=
        "detect-number";

      number.textContent =
        index+1;


      box.appendChild(number);

      detectOverlay.appendChild(box);

    }
  );

}


/* =========================
   全部採用
========================= */

addAllBtn.addEventListener(
  "click",
  function(){

    if(!detectedItems.length){
      return;
    }


    items=[];

    detectedItems.forEach(
      (rect)=>{

        const dataUrl =
          cropImage(rect);


        items.push({

          id:itemId++,

          x:rect.x,
          y:rect.y,
          w:rect.w,
          h:rect.h,

          dataUrl:dataUrl,

          quantity:1,
          name:"",
          memo:"",

          starIndex:0,

          done:false

        });

      }
    );


    renderGoods();

    previewPanel.style.display =
      "block";

    statusEl.textContent =
      `${items.length}個採用しました！`;

  }
);


/* =========================
   採用を全部解除
========================= */

clearSelectedBtn.addEventListener(
  "click",
  function(){

    items=[];

    renderGoods();

    statusEl.textContent =
      "採用を解除しました";

  }
);


/* =========================
   画像切り抜き
========================= */

function cropImage(rect){

  const canvas =
    document.createElement("canvas");

  canvas.width =
    Math.max(1,rect.w);

  canvas.height =
    Math.max(1,rect.h);

  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(

    originalImage,

    rect.x,
    rect.y,
    rect.w,
    rect.h,

    0,
    0,
    rect.w,
    rect.h

  );


  return canvas.toDataURL(
    "image/png"
  );

}


/* =========================
   行を自動判定
========================= */

function makeRows(){

  const sorted =
    [...items].sort(
      (a,b)=>a.y-b.y
    );


  const rows=[];


  sorted.forEach(item=>{

    const centerY =
      item.y+item.h/2;


    let target=null;


    for(const row of rows){

      const tolerance =
        Math.max(
          item.h,
          row.maxH
        )*0.55;


      if(
        Math.abs(
          centerY-row.centerY
        ) < tolerance
      ){

        target=row;
        break;

      }

    }


    if(!target){

      target={
        items:[],
        centerY:centerY,
        maxH:item.h,
        minY:item.y,
        layoutY:0
      };

      rows.push(target);

    }


    target.items.push(item);

    target.maxH =
      Math.max(
        target.maxH,
        item.h
      );

    target.minY =
      Math.min(
        target.minY,
        item.y
      );


    target.centerY =
      target.items.reduce(
        (sum,x)=>
          sum+x.y+x.h/2,
        0
      )/
      target.items.length;

  });


  rows.sort(
    (a,b)=>a.minY-b.minY
  );


  const blankHeight =
    Number(
      blankHeightInput.value
    ) || 65;


  const rowGap=12;


  let currentY =
    rows.length ?
      rows[0].minY :
      0;


  rows.forEach(row=>{

    row.layoutY=currentY;

    currentY +=
      row.maxH+
      blankHeight+
      rowGap;

  });


  return {
    rows,
    height:currentY+10
  };

}


/* =========================
   グッズ表示
========================= */

function renderGoods(){

  goodsCanvas.innerHTML="";


  if(!items.length){

    goodsCanvas.appendChild(
      emptyMessage
    );

    goodsCanvas.style.height=
      "200px";

    return;

  }


  const layout =
    makeRows();


  const layoutHeight =
    layout.height;


  goodsCanvas.style.height =
    layoutHeight+"px";


  const blankHeight =
    Number(
      blankHeightInput.value
    ) || 65;


  layout.rows.forEach(
    row=>{

      row.items
        .sort((a,b)=>a.x-b.x)
        .forEach(item=>{

          const goods =
            document.createElement("div");

          goods.className="goods";


          goods.style.left =
            (
              item.x/sourceWidth*100
            )+"%";


          goods.style.top =
            (
              row.layoutY/layoutHeight*100
            )+"%";


          goods.style.width =
            (
              item.w/sourceWidth*100
            )+"%";


          if(item.done){
            goods.classList.add(
              "done"
            );
          }


          /* 画像 */

          const imageWrap =
            document.createElement("div");

          imageWrap.className=
            "goods-image-wrap";


          const img =
            document.createElement("img");

          img.className="goods-image";

          img.src=item.dataUrl;

          img.alt=
            item.name ||
            "グッズ";


          img.addEventListener(
            "click",
            function(){

              item.done =
                !item.done;

              goods.classList.toggle(
                "done",
                item.done
              );

            }
          );


          imageWrap.appendChild(img);


          /* 星 */

          const star =
            document.createElement("button");

          star.className="star";

          star.textContent="★";

          star.style.color =
            starColors[
              item.starIndex
            ];


          star.addEventListener(
            "click",
            function(e){

              e.stopPropagation();

              item.starIndex =
                (
                  item.starIndex+1
                )%
                starColors.length;


              star.style.color =
                starColors[
                  item.starIndex
                ];

              updateLegend();

            }
          );


          imageWrap.appendChild(star);


          /* 削除 */

          const deleteBtn =
            document.createElement("button");

          deleteBtn.className=
            "delete-item";

          deleteBtn.textContent="×";


          deleteBtn.addEventListener(
            "click",
            function(e){

              e.stopPropagation();

              items =
                items.filter(
                  x=>x.id!==item.id
                );

              renderGoods();

            }
          );


          imageWrap.appendChild(
            deleteBtn
          );


          goods.appendChild(
            imageWrap
          );


          /* 情報欄 */

          const info =
            document.createElement("div");

          info.className=
            "goods-info";


          info.style.height =
            blankHeight+"px";


          /* 個数 */

          const quantityRow =
            document.createElement("div");

          quantityRow.className=
            "quantity-row";


          const left =
            document.createElement("span");

          left.className=
            "quantity-mark";

          left.textContent="（";


          const quantity =
            document.createElement("input");

          quantity.className=
            "quantity-input";

          quantity.type="number";

          quantity.min="0";

          quantity.value=
            item.quantity;


          quantity.addEventListener(
            "input",
            function(){

              item.quantity =
                Number(
                  quantity.value
                ) || 0;

            }
          );


          const right =
            document.createElement("span");

          right.className=
            "quantity-mark";

          right.textContent="）";


          quantityRow.appendChild(left);
          quantityRow.appendChild(quantity);
          quantityRow.appendChild(right);


          info.appendChild(
            quantityRow
          );


          /* 名前 */

          const name =
            document.createElement("input");

          name.className=
            "goods-name";

          name.placeholder=
            "グッズ名";

          name.value=
            item.name;


          name.addEventListener(
            "input",
            function(){

              item.name =
                name.value;

            }
          );


          info.appendChild(name);


          /* メモ */

          const memo =
            document.createElement("input");

          memo.className=
            "goods-memo";

          memo.placeholder=
            "メモ";

          memo.value=
            item.memo;


          memo.addEventListener(
            "input",
            function(){

              item.memo =
                memo.value;

            }
          );


          info.appendChild(memo);


          /* 星色変更 */

          const tools =
            document.createElement("div");

          tools.className=
            "edit-tools";


          const select =
            document.createElement("select");

          select.className=
            "star-color";


          starColors.forEach(
            (color,index)=>{

              const option =
                document.createElement(
                  "option"
                );

              option.value=index;

              option.textContent =
                "★ "+
                (
                  index+1
                );

              option.style.color=
                color;

              select.appendChild(
                option
              );

            }
          );


          select.value =
            item.starIndex;


          select.addEventListener(
            "change",
            function(){

              item.starIndex =
                Number(
                  select.value
                );

              star.style.color =
                starColors[
                  item.starIndex
                ];

              updateLegend();

            }
          );


          tools.appendChild(
            select
          );


          info.appendChild(
            tools
          );


          goods.appendChild(
            info
          );


          goodsCanvas.appendChild(
            goods
          );

        });

    });


  updatePreviewSize();

  updateLegend();

}


/* =========================
   プレビューサイズ
========================= */

function updatePreviewSize(){

  if(!items.length){
    return;
  }


  const layout =
    makeRows();


  const naturalWidth =
    sourceWidth;


  const availableWidth =
    goodsCanvas.parentElement
      .clientWidth;


  const scale =
    Math.min(
      1,
      availableWidth/naturalWidth
    );


  goodsCanvas.style.width =
    naturalWidth*scale+"px";


  goodsCanvas.style.height =
    layout.height*scale+"px";


  document
    .querySelectorAll(
      ".goods-info"
    )
    .forEach(info=>{

      const blankHeight =
        Number(
          blankHeightInput.value
        ) || 65;

      info.style.height =
        blankHeight*scale+"px";

    });

}


/* =========================
   星の説明
========================= */

function updateLegend(){

  const legend =
    document.getElementById(
      "legend"
    );

  legend.innerHTML="";


  for(let i=0;i<3;i++){

    const color =
      document.getElementById(
        "legendColor"+i
      ).value;

    const text =
      document.getElementById(
        "legendText"+i
      ).value;


    const div =
      document.createElement("div");

    div.className=
      "legend-item";


    const star =
      document.createElement("span");

    star.className=
      "legend-star";

    star.textContent="★";

    star.style.color=color;


    const label =
      document.createElement("span");

    label.textContent=text;


    div.appendChild(star);
    div.appendChild(label);

    legend.appendChild(div);

  }

}


/* =========================
   設定変更
========================= */

blankHeightInput.addEventListener(
  "input",
  function(){

    renderGoods();

  }
);


for(let i=0;i<3;i++){

  document
    .getElementById(
      "legendColor"+i
    )
    .addEventListener(
      "input",
      updateLegend
    );


  document
    .getElementById(
      "legendText"+i
    )
    .addEventListener(
      "input",
      updateLegend
    );

}


/* =========================
   スクショモード
========================= */

screenshotBtn.addEventListener(
  "click",
  function(){

    screenshotMode=true;

    document.body.classList.add(
      "screenshot-mode"
    );

    updatePreviewSize();

  }
);


document.body.addEventListener(
  "click",
  function(e){

    if(
      screenshotMode &&
      !e.target.closest(".goods")
    ){

      screenshotMode=false;

      document.body.classList.remove(
        "screenshot-mode"
      );

      updatePreviewSize();

    }

  }
);


/* =========================
   リセット
========================= */

resetBtn.addEventListener(
  "click",
  function(){

    if(
      !confirm(
        "全部リセットしますか？"
      )
    ){
      return;
    }


    originalImage=null;

    detectedItems=[];

    items=[];

    itemId=1;

    imageInput.value="";

    sourceArea.style.display=
      "none";

    previewPanel.style.display=
      "none";

    detectBtn.disabled=true;

    statusEl.textContent=
      "画像を選択してください";

    sourceCtx.clearRect(
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );

    detectOverlay.innerHTML="";

    renderGoods();

  }
);


/* =========================
   画面サイズ変更
========================= */

window.addEventListener(
  "resize",
  function(){

    drawDetectionOverlay();

    updatePreviewSize();

  }
);


/* 初期表示 */

updateLegend();

</script>
