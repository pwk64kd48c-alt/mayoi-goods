<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迷子グッズメーカー</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f5;
  color:#333;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:18px 16px;
  text-align:center;
  font-weight:bold;
  font-size:20px;
  border-bottom:1px solid #eee;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

section{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

h2{
  margin:0 0 12px;
  font-size:17px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#333;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

button.sub{
  background:#eee;
  color:#333;
}

button.danger{
  background:#e66;
}

input,
select,
textarea{
  font:inherit;
}

.file{
  width:100%;
  padding:10px;
  background:#f7f7f7;
  border-radius:10px;
}

.info{
  font-size:12px;
  color:#777;
  line-height:1.7;
  margin-top:8px;
}

/* 選択画面 */
.canvas-wrap{
  width:100%;
  overflow:hidden;
  border-radius:10px;
  background:#eee;
}

#selectCanvas{
  display:block;
  width:100%;
  height:auto;
  touch-action:none;
  cursor:crosshair;
}

.select-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.status{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

/* 選択済み一覧 */
.selected-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:8px 0 2px;
}

.selected-item{
  flex:0 0 90px;
  position:relative;
  background:#fafafa;
  border-radius:10px;
  padding:6px;
  text-align:center;
}

.selected-item img{
  width:100%;
  height:70px;
  object-fit:contain;
  display:block;
  background:#fff;
  border-radius:6px;
}

.selected-number{
  font-size:11px;
  color:#777;
  margin-top:4px;
}

.selected-delete{
  position:absolute;
  top:3px;
  right:3px;
  width:22px;
  height:22px;
  padding:0;
  border-radius:50%;
  background:#e66;
  font-size:12px;
}

/* 設定 */
.setting-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.setting-row label{
  font-size:13px;
  min-width:150px;
}

.setting-row input[type="number"]{
  width:80px;
  padding:7px;
  border:1px solid #ddd;
  border-radius:8px;
}

.legend-editor{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.legend-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.legend-row input[type="color"]{
  width:38px;
  height:35px;
  padding:2px;
}

.legend-row input[type="text"]{
  flex:1;
  min-width:0;
  padding:8px;
  border:1px solid #ddd;
  border-radius:8px;
}

/* 完成エリア */
#previewArea{
  background:#fff;
  overflow:hidden;
}

#goodsCanvas{
  position:relative;
  width:100%;
  background:#fff;
  overflow:hidden;
}

/* グッズ */
.goods{
  position:absolute;
  transform-origin:top left;
}

.goods-image-wrap{
  position:relative;
  width:100%;
}

.goods-image{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  cursor:pointer;
  transition:opacity .2s;
}

.goods.done .goods-image{
  opacity:.28;
}

/* 星 */
.star{
  position:absolute;
  top:2px;
  right:2px;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  font-size:24px;
  line-height:1;
  cursor:pointer;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
}

/* 自動記載欄 */
.goods-info{
  width:100%;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:3px 5px;
}

.quantity{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:bold;
  line-height:1;
}

.quantity input{
  width:34px;
  padding:1px;
  border:0;
  outline:0;
  background:transparent;
  text-align:center;
  font-weight:bold;
  font-size:15px;
}

.name-input{
  width:100%;
  border:0;
  outline:0;
  text-align:center;
  background:transparent;
  font-size:11px;
  color:#333;
}

.memo-input{
  width:100%;
  border:0;
  outline:0;
  text-align:center;
  background:transparent;
  font-size:10px;
  color:#777;
  resize:none;
  height:18px;
}

.edit-tools{
  display:flex;
  align-items:center;
  gap:3px;
  justify-content:center;
}

.star-color{
  font-size:9px;
  border:0;
  padding:1px 3px;
  background:#f3f3f3;
  border-radius:5px;
}

/* 削除 */
.goods-delete{
  position:absolute;
  top:2px;
  left:2px;
  width:21px;
  height:21px;
  border-radius:50%;
  padding:0;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:12px;
  z-index:5;
}

/* 凡例 */
.legend-output{
  display:flex;
  flex-wrap:wrap;
  gap:10px 16px;
  padding:12px 4px 0;
  font-size:12px;
}

.legend-output-item{
  display:flex;
  align-items:center;
  gap:4px;
}

.legend-star{
  font-size:16px;
}

/* スクショモード */
body.screenshot-mode{
  background:#fff;
}

body.screenshot-mode header,
body.screenshot-mode .edit-only{
  display:none !important;
}

body.screenshot-mode main{
  max-width:none;
  padding:0;
}

body.screenshot-mode section{
  padding:0;
  margin:0;
  border-radius:0;
}

body.screenshot-mode #selectionSection,
body.screenshot-mode #settingSection{
  display:none;
}

body.screenshot-mode #previewSection{
  display:block;
}

body.screenshot-mode .goods-delete,
body.screenshot-mode .star-color{
  display:none;
}

body.screenshot-mode .name-input,
body.screenshot-mode .memo-input{
  pointer-events:none;
}

body.screenshot-mode .quantity input{
  pointer-events:none;
}

body.screenshot-mode .star{
  pointer-events:none;
}
</style>
</head>

<body>

<header>
迷子グッズメーカー
</header>

<main>

<!-- 画像 -->
<section>
<h2>① 元画像を入れる</h2>

<input
  id="imageInput"
  class="file"
  type="file"
  accept="image/*"
>

<div class="info">
グッズが並んでいる画像を入れてね。<br>
画像を読み込んだら、グッズを1個ずつ指で囲んで切り抜けます。
</div>
</section>


<!-- 選択 -->
<section id="selectionSection">

<h2>② グッズを選択</h2>

<div class="canvas-wrap">
<canvas id="selectCanvas"></canvas>
</div>

<div class="select-buttons">

<button id="selectModeBtn">
✂️ 選択モード ON
</button>

<button id="clearSelectedBtn" class="sub">
選択を全部消す
</button>

</div>

<div class="status" id="selectionStatus">
画像を入れて、グッズを指で囲んでね。
</div>

<div id="selectedList" class="selected-list"></div>

</section>


<!-- 設定 -->
<section id="settingSection">

<h2>③ 記載欄の設定</h2>

<div class="setting-row">

<label>
画像の下の記載欄の高さ
</label>

<input
  id="blankHeight"
  type="number"
  min="30"
  max="150"
  value="65"
>

<span>px</span>

</div>

<div class="info">
グッズ画像の真下に、この高さの白い記載欄が自動で付きます。
</div>

<hr>

<div class="legend-editor">

<strong style="font-size:13px">
⭐ 星の説明
</strong>

<div class="legend-row">

<input
  id="legendColor1"
  type="color"
  value="#FFD43B"
>

<input
  id="legendText1"
  type="text"
  value="交換優先"
  placeholder="説明"
>

</div>

<div class="legend-row">

<input
  id="legendColor2"
  type="color"
  value="#FF8FB3"
>

<input
  id="legendText2"
  type="text"
  value="抱き合わせ希望"
  placeholder="説明"
>

</div>

<div class="legend-row">

<input
  id="legendColor3"
  type="color"
  value="#9AA0A6"
>

<input
  id="legendText3"
  type="text"
  value="通常"
  placeholder="説明"
>

</div>

</div>

</section>


<!-- 完成 -->
<section id="previewSection">

<h2 class="edit-only">
④ 完成イメージ
</h2>

<div id="previewArea">

<div id="goodsCanvas"></div>

<div id="legendOutput" class="legend-output"></div>

</div>

<div class="select-buttons edit-only">

<button id="screenshotBtn">
📱 スクショモード
</button>

<button id="resetBtn" class="danger">
リセット
</button>

</div>

</section>

</main>


<script>

const imageInput =
document.getElementById("imageInput");

const selectCanvas =
document.getElementById("selectCanvas");

const selectCtx =
selectCanvas.getContext("2d");

const selectedList =
document.getElementById("selectedList");

const selectionStatus =
document.getElementById("selectionStatus");

const goodsCanvas =
document.getElementById("goodsCanvas");

const blankHeightInput =
document.getElementById("blankHeight");

const selectModeBtn =
document.getElementById("selectModeBtn");

const clearSelectedBtn =
document.getElementById("clearSelectedBtn");

const screenshotBtn =
document.getElementById("screenshotBtn");

const resetBtn =
document.getElementById("resetBtn");


let sourceImage = null;

let sourceWidth = 0;
let sourceHeight = 0;

let selecting = true;

let isDragging = false;

let startPoint = null;
let currentPoint = null;

let items = [];

let itemId = 1;


/* 星の色 */
const starColors = [
"#FFD43B",
"#FF8FB3",
"#9AA0A6",
"#7CC7FF",
"#B98CFF"
];


/* =========================
画像読み込み
========================= */

imageInput.addEventListener(
"change",
function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

sourceImage = img;

sourceWidth =
img.naturalWidth;

sourceHeight =
img.naturalHeight;

selectCanvas.width =
sourceWidth;

selectCanvas.height =
sourceHeight;

items = [];

itemId = 1;

drawSelectionCanvas();

renderSelectedList();

renderPreview();

selecting = true;

updateSelectButton();

selectionStatus.textContent =
"グッズを1個ずつ指で囲んでね。";

};

img.src = e.target.result;

};

reader.readAsDataURL(file);

});


/* =========================
選択モード
========================= */

selectModeBtn.addEventListener(
"click",
function(){

selecting = !selecting;

updateSelectButton();

});


function updateSelectButton(){

if(selecting){

selectModeBtn.textContent =
"✂️ 選択モード ON";

}else{

selectModeBtn.textContent =
"✋ 選択モード OFF";

}

}


/* =========================
Canvas座標
========================= */

function getCanvasPoint(e){

const rect =
selectCanvas.getBoundingClientRect();

if(!rect.width || !rect.height){

return {
x:0,
y:0
};

}

const x =
(e.clientX - rect.left)
*
sourceWidth
/
rect.width;

const y =
(e.clientY - rect.top)
*
sourceHeight
/
rect.height;

return {

x:Math.max(
0,
Math.min(sourceWidth,x)
),

y:Math.max(
0,
Math.min(sourceHeight,y)
)

};

}


/* =========================
指で選択
========================= */

selectCanvas.addEventListener(
"pointerdown",
function(e){

if(!sourceImage || !selecting)
return;

e.preventDefault();

selectCanvas.setPointerCapture(
e.pointerId
);

isDragging = true;

startPoint =
getCanvasPoint(e);

currentPoint =
startPoint;

drawSelectionCanvas();

});


selectCanvas.addEventListener(
"pointermove",
function(e){

if(!isDragging)
return;

e.preventDefault();

currentPoint =
getCanvasPoint(e);

drawSelectionCanvas();

});


selectCanvas.addEventListener(
"pointerup",
function(e){

if(!isDragging)
return;

e.preventDefault();

isDragging = false;

currentPoint =
getCanvasPoint(e);

createCrop();

});


selectCanvas.addEventListener(
"pointercancel",
function(){

isDragging = false;

});


/* =========================
選択画面描画
========================= */

function drawSelectionCanvas(){

if(!sourceImage)
return;

selectCtx.clearRect(
0,
0,
sourceWidth,
sourceHeight
);

selectCtx.drawImage(
sourceImage,
0,
0,
sourceWidth,
sourceHeight
);


/* 選択済み */
items.forEach(
function(item,index){

selectCtx.save();

selectCtx.strokeStyle =
"#4CAF50";

selectCtx.lineWidth =
Math.max(
3,
sourceWidth / 400
);

selectCtx.setLineDash([
8,
5
]);

selectCtx.strokeRect(
item.x,
item.y,
item.w,
item.h
);

selectCtx.fillStyle =
"#4CAF50";

selectCtx.font =
`bold ${Math.max(
20,
sourceWidth / 30
)}px sans-serif`;

selectCtx.fillText(
String(index + 1),
item.x + 5,
item.y + 25
);

selectCtx.restore();

});


/* 現在選択中 */
if(
isDragging &&
startPoint &&
currentPoint
){

const x =
Math.min(
startPoint.x,
currentPoint.x
);

const y =
Math.min(
startPoint.y,
currentPoint.y
);

const w =
Math.abs(
currentPoint.x -
startPoint.x
);

const h =
Math.abs(
currentPoint.y -
startPoint.y
);

selectCtx.save();

selectCtx.fillStyle =
"rgba(255,255,255,.18)";

selectCtx.fillRect(
x,
y,
w,
h
);

selectCtx.strokeStyle =
"#ff4d88";

selectCtx.lineWidth =
Math.max(
3,
sourceWidth / 400
);

selectCtx.setLineDash([]);

selectCtx.strokeRect(
x,
y,
w,
h
);

selectCtx.restore();

}

}


/* =========================
実際に切り抜く
========================= */

function createCrop(){

if(
!startPoint ||
!currentPoint ||
!sourceImage
)
return;

const x =
Math.round(
Math.min(
startPoint.x,
currentPoint.x
)
);

const y =
Math.round(
Math.min(
startPoint.y,
currentPoint.y
)
);

const w =
Math.round(
Math.abs(
currentPoint.x -
startPoint.x
)
);

const h =
Math.round(
Math.abs(
currentPoint.y -
startPoint.y
)
);


if(w < 8 || h < 8){

selectionStatus.textContent =
"もう少し大きくグッズを囲んでね。";

drawSelectionCanvas();

return;

}


const cropCanvas =
document.createElement("canvas");

cropCanvas.width = w;
cropCanvas.height = h;

const cropCtx =
cropCanvas.getContext("2d");

cropCtx.drawImage(
sourceImage,
x,
y,
w,
h,
0,
0,
w,
h
);

const dataUrl =
cropCanvas.toDataURL("image/png");


items.push({

id:itemId++,

x:x,
y:y,
w:w,
h:h,

dataUrl:dataUrl,

quantity:1,

name:"",

memo:"",

starIndex:0,

done:false

});


renderSelectedList();

drawSelectionCanvas();

renderPreview();

selectionStatus.textContent =
`選択済み ${items.length}個。続けて他のグッズも囲めるよ！`;

}


/* =========================
選択済み一覧
========================= */

function renderSelectedList(){

selectedList.innerHTML = "";

items.forEach(
function(item,index){

const box =
document.createElement("div");

box.className =
"selected-item";

const img =
document.createElement("img");

img.src =
item.dataUrl;

const number =
document.createElement("div");

number.className =
"selected-number";

number.textContent =
`#${index + 1}`;

const del =
document.createElement("button");

del.className =
"selected-delete";

del.textContent =
"×";

del.addEventListener(
"click",
function(){

items =
items.filter(
x => x.id !== item.id
);

renderSelectedList();

drawSelectionCanvas();

renderPreview();

});

box.appendChild(img);

box.appendChild(number);

box.appendChild(del);

selectedList.appendChild(box);

});

}


/* =========================
全部消す
========================= */

clearSelectedBtn.addEventListener(
"click",
function(){

items = [];

renderSelectedList();

drawSelectionCanvas();

renderPreview();

selectionStatus.textContent =
"選択を全部消したよ。";

});


/* =========================
プレビュー
========================= */

function renderPreview(){

goodsCanvas.innerHTML = "";

if(
!sourceImage ||
items.length === 0
){

goodsCanvas.style.height =
"150px";

renderLegend();

return;

}


const blankHeight =
Math.max(
30,
Number(blankHeightInput.value) || 65
);


/*
元画像のY位置から
何段目かを自動判定
*/

const sorted =
[...items].sort(
(a,b) => a.y - b.y
);

const rows = [];


sorted.forEach(
function(item){

const centerY =
item.y + item.h / 2;

let row = null;


for(
let i = 0;
i < rows.length;
i++
){

const tolerance =
Math.max(
item.h,
rows[i].maxH
) * 0.55;

if(
Math.abs(
centerY -
rows[i].centerY
)
<
tolerance
){

row = rows[i];

break;

}

}


if(!row){

row = {

items:[],
centerY:centerY,
maxH:item.h,
minY:item.y

};

rows.push(row);

}


row.items.push(item);

row.maxH =
Math.max(
row.maxH,
item.h
);

row.minY =
Math.min(
row.minY,
item.y
);

row.centerY =
row.items.reduce(
(sum,x) =>
sum +
x.y +
x.h / 2,
0
)
/
row.items.length;

});


/* 上から順番 */
rows.sort(
(a,b) =>
a.minY -
b.minY
);


/*
各段を配置
*/

const rowGap = 12;

let currentY =
rows.length
?
rows[0].minY
:
0;


rows.forEach(
function(row){

row.layoutY =
currentY;

currentY +=
row.maxH +
blankHeight +
rowGap;

});


/*
全体の高さ
*/

let layoutHeight =
sourceHeight;


if(rows.length){

const lastRow =
rows[rows.length - 1];

layoutHeight =
Math.max(
sourceHeight,
lastRow.layoutY +
lastRow.maxH +
blankHeight +
10
);

}


goodsCanvas.dataset.layoutHeight =
layoutHeight;


/*
グッズを配置
*/

rows.forEach(
function(row){

row.items.forEach(
function(item){

createGoodsElement(
item,
items.indexOf(item),
row.layoutY,
layoutHeight
);

});

});


updatePreviewSize();

renderLegend();

}


/* =========================
グッズ1個
========================= */

function createGoodsElement(
item,
index,
layoutY,
layoutHeight
){

const goods =
document.createElement("div");

goods.className =
"goods";

goods.dataset.id =
item.id;


/* 横位置は元画像 */
goods.style.left =
`${item.x / sourceWidth * 100}%`;


/* 縦位置は自動 */
goods.style.top =
`${layoutY / layoutHeight * 100}%`;


goods.style.width =
`${item.w / sourceWidth * 100}%`;


/* 画像 */
const imageWrap =
document.createElement("div");

imageWrap.className =
"goods-image-wrap";


const img =
document.createElement("img");

img.className =
"goods-image";

img.src =
item.dataUrl;

img.draggable =
false;


if(item.done){

goods.classList.add("done");

}


img.addEventListener(
"click",
function(){

item.done =
!item.done;

goods.classList.toggle(
"done",
item.done
);

});


/* 星 */
const star =
document.createElement("button");

star.className =
"star";

star.textContent =
"★";

star.style.color =
starColors[item.starIndex];


star.addEventListener(
"click",
function(e){

e.stopPropagation();

item.starIndex =
(
item.starIndex + 1
)
%
starColors.length;

star.style.color =
starColors[item.starIndex];

});


/* 削除 */
const deleteBtn =
document.createElement("button");

deleteBtn.className =
"goods-delete edit-only";

deleteBtn.textContent =
"×";


deleteBtn.addEventListener(
"click",
function(e){

e.stopPropagation();

items =
items.filter(
x => x.id !== item.id
);

renderSelectedList();

drawSelectionCanvas();

renderPreview();

});


imageWrap.appendChild(img);
imageWrap.appendChild(star);
imageWrap.appendChild(deleteBtn);


/* =================
記載欄
================= */

const info =
document.createElement("div");

info.className =
"goods-info";


/* 数量 */
const quantity =
document.createElement("div");

quantity.className =
"quantity";


const left =
document.createElement("span");

left.textContent =
"（";


const quantityInput =
document.createElement("input");

quantityInput.type =
"number";

quantityInput.min =
"0";

quantityInput.value =
item.quantity;


quantityInput.addEventListener(
"input",
function(){

item.quantity =
this.value;

});


const right =
document.createElement("span");

/* =========================
サイズ調整
========================= */

function updatePreviewSize(){

if(!sourceWidth)
return;


const layoutHeight =
Number(
goodsCanvas.dataset.layoutHeight
)
||
sourceHeight;


const width =
goodsCanvas.clientWidth;


if(!width)
return;


const scale =
width /
sourceWidth;


goodsCanvas.style.height =
`${layoutHeight * scale}px`;


const blankHeight =
Math.max(
30,
Number(blankHeightInput.value) || 65
);


document
.querySelectorAll(".goods-info")
.forEach(
function(info){

info.style.height =
`${blankHeight * scale}px`;

});

}


window.addEventListener(
"resize",
function(){

updatePreviewSize();

});


blankHeightInput.addEventListener(
"input",
function(){

renderPreview();

});


/* =========================
凡例
========================= */

function renderLegend(){

const output =
document.getElementById(
"legendOutput"
);

output.innerHTML = "";


for(
let i=1;
i<=3;
i++
){

const color =
document.getElementById(
"legendColor" + i
).value;

const text =
document.getElementById(
"legendText" + i
).value;


if(!text)
continue;


const row =
document.createElement("div");

row.className =
"legend-output-item";


const star =
document.createElement("span");

star.className =
"legend-star";

star.textContent =
"★";

star.style.color =
color;


const label =
document.createElement("span");

label.textContent =
text;


row.appendChild(star);
row.appendChild(label);

output.appendChild(row);

}

}


[
"legendColor1",
"legendColor2",
"legendColor3",
"legendText1",
"legendText2",
"legendText3"
].forEach(
function(id){

document
.getElementById(id)
.addEventListener(
"input",
renderLegend
);

});
