<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迷子グッズ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

header{
  background:#fff;
  padding:20px 15px 14px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:22px;
  letter-spacing:.08em;
}

.nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:#fff;
}

.nav button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px 5px;
  background:#e5e5e5;
  color:#555;
  font-weight:bold;
}

.nav button.active{
  background:#777;
  color:#fff;
}

main{
  max-width:720px;
  margin:auto;
  padding:15px;
}

.screen{display:none}
.screen.active{display:block}

.title{
  font-size:19px;
  font-weight:bold;
  margin:5px 0 14px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin-bottom:14px;
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#666;
  color:#fff;
  font-weight:bold;
}

.sub{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#eee;
  color:#555;
}

.full{width:100%}

.group{margin-bottom:16px}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input[type="number"],
select{
  width:100%;
  border:1px solid #ccc;
  border-radius:9px;
  padding:10px;
  background:#fff;
}

input[type="file"]{width:100%}

.preview{
  display:block;
  max-width:100%;
  max-height:260px;
  margin:10px auto 0;
  border-radius:8px;
  object-fit:contain;
}

.char-tools{
  display:flex;
  gap:7px;
  margin-bottom:10px;
}

.char-tools button{flex:1}

.unit{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 7px;
  padding-bottom:5px;
  border-bottom:1px solid #ddd;
}

.char-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.char{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fafafa;
  font-size:13px;
}

.char.selected{
  background:#eee;
  border-color:#999;
}

.char input{width:auto}

.quantity-title{
  margin:15px 0 7px;
  font-size:13px;
  font-weight:bold;
}

.qty-head,
.qty-row{
  display:grid;
  grid-template-columns:1fr 75px 75px;
  gap:6px;
  align-items:center;
}

.qty-head{
  color:#888;
  font-size:10px;
  margin-bottom:5px;
}

.qty-row{margin-bottom:7px}

.qty-row .name{
  font-weight:bold;
  font-size:13px;
}

.qty-row input{
  text-align:center;
  padding:8px 4px;
}

.note{
  font-size:11px;
  color:#888;
  margin-bottom:8px;
}

.saved{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}

.saved-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.saved-type{font-weight:bold}

.saved-actions{
  display:flex;
  gap:5px;
}

.saved-actions button{
  border:0;
  border-radius:8px;
  padding:6px 9px;
  background:#eee;
  font-size:12px;
}

.saved-image{
  display:block;
  max-width:100%;
  max-height:150px;
  margin:10px auto;
  border-radius:7px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.chip{
  background:#eee;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}

.screenshot{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.ss-title{
  text-align:center;
  font-weight:bold;
  font-size:17px;
  margin-bottom:4px;
}

.legend{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-bottom:12px;
}

.ss-section{margin-bottom:15px}

.ss-type{
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #ddd;
  padding-bottom:4px;
  margin-bottom:5px;
}

.ss-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px 15px;
}

.ss-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dotted #ddd;
  padding:4px 0;
  font-size:12px;
}

.retrade{
  font-size:10px;
  margin-left:3px;
}

/* 仮約束 */
.promise-head,
.promise-row{
  display:grid;
  grid-template-columns:1fr 70px 70px 70px;
  gap:6px;
  align-items:center;
}

.promise-head{
  color:#888;
  font-size:10px;
  margin-bottom:5px;
}

.promise-row{margin-bottom:7px}

.promise-row input{
  width:100%;
  padding:8px 3px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:8px;
}

.promise-row input[data-premain]{
  background:#f1f1f1;
}

.purchase-box{
  background:#f7f7f7;
  border:1px solid #ddd;
  border-radius:11px;
  padding:12px;
}

.purchase-box label{
  margin-bottom:7px;
}

.purchase-box input{
  text-align:center;
  font-size:17px;
  font-weight:bold;
}

.back{margin-bottom:12px}

@media(max-width:430px){

  .promise-head,
  .promise-row{
    grid-template-columns:1fr 52px 52px 52px;
    gap:4px;
  }

  .promise-row input{
    padding:7px 1px;
    font-size:12px;
  }

  .promise-head{
    font-size:9px;
  }
}
</style>
</head>

<body>

<header>
  <h1>迷子グッズ</h1>
</header>

<div class="nav">

  <button
    id="navMayoi"
    class="active"
    onclick="showScreen('mayoi')">
    🧸 迷子
  </button>

  <button
    id="navPromise"
    onclick="showScreen('promise')">
    🤝 仮約束
  </button>

</div>

<main>

<!-- =====================================================
     迷子
===================================================== -->

<section id="mayoiScreen" class="screen active">

  <div id="mayoiHome">

    <div class="title">🧸 迷子</div>

    <button
      class="primary"
      onclick="openMayoiForm()">
      ＋ 迷子グッズを登録
    </button>

    <div style="height:10px"></div>

    <button
      class="sub full"
      onclick="showMayoiScreenshot()">
      📸 スクショ用を見る
    </button>

    <div id="mayoiList"></div>

  </div>

  <div id="mayoiForm" style="display:none">

    <button
      class="sub back"
      onclick="closeMayoiForm()">
      ← 戻る
    </button>

    <div class="title" id="mayoiFormTitle">
      迷子グッズを登録
    </div>

    <div class="card">

      <div class="group">

        <label>グッズ種類</label>

        <select id="mayoiType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>

      </div>

      <div class="group">

        <label>グッズ画像</label>

        <input
          type="file"
          id="mayoiImage"
          accept="image/*"
          onchange="previewMayoiImage()">

        <img
          id="imagePreview"
          class="preview"
          style="display:none">

      </div>

      <div class="group">

        <label>キャラ</label>

        <div class="note">
          画像にいるキャラを選択してね。全員選択もできるよ！
        </div>

        <div class="char-tools">

          <button
            class="sub"
            onclick="selectAllMayoi()">
            ☑ 全員選択
          </button>

          <button
            class="sub"
            onclick="clearAllMayoi()">
            □ 全解除
          </button>

        </div>

        <div id="characterList"></div>

      </div>

      <div id="quantityArea"></div>

      <button
        class="primary"
        onclick="saveMayoi()">
        保存する
      </button>

    </div>

  </div>

  <div id="mayoiScreenshot" style="display:none">

    <button
      class="sub back"
      onclick="closeMayoiScreenshot()">
      ← 戻る
    </button>

    <div class="title">📸 スクショ用</div>

    <div id="mayoiScreenshotContent"></div>

  </div>

</section>


<!-- =====================================================
     仮約束
===================================================== -->

<section id="promiseScreen" class="screen">

  <div id="promiseHome">

    <div class="title">🤝 仮約束</div>

    <button
      class="primary"
      onclick="openPromiseForm()">
      ＋ 仮約束を登録
    </button>

    <div style="height:10px"></div>

    <button
      class="sub full"
      onclick="showPromiseScreenshot()">
      📸 スクショ用を見る
    </button>

    <div id="promiseList"></div>

  </div>


  <div id="promiseForm" style="display:none">

    <button
      class="sub back"
      onclick="closePromiseForm()">
      ← 戻る
    </button>

    <div
      class="title"
      id="promiseFormTitle">
      仮約束を登録
    </div>

    <div class="card">

      <div class="group">

        <label>グッズ種類</label>

        <select id="promiseType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>

      </div>


      <div class="group">

        <label>グッズ画像</label>

        <input
          type="file"
          id="promiseImage"
          accept="image/*"
          onchange="previewPromiseImage()">

        <img
          id="promiseImagePreview"
          class="preview"
          style="display:none">

      </div>


      <!-- ★ 購入総数を一括入力 -->
      <div class="group purchase-box">

        <label>購入数</label>

        <input
          type="number"
          id="promisePurchaseQty"
          min="0"
          value="1"
          oninput="updateAllPromiseRemaining()">

      </div>


      <div class="group">

        <label>キャラ</label>

        <div class="note">
          画像にいるキャラを選択してね。全員選択もできるよ！
        </div>

        <div class="char-tools">

          <button
            class="sub"
            onclick="selectAllPromise()">
            ☑ 全員選択
          </button>

          <button
            class="sub"
            onclick="clearAllPromise()">
            □ 全解除
          </button>

        </div>

        <div id="promiseCharacterList"></div>

      </div>


      <div class="group">

        <div class="promise-head">

          <span>キャラ</span>
          <span>約束</span>
          <span>残り</span>
          <span>再交換</span>

        </div>

        <div id="promiseDetail"></div>

      </div>


      <button
        class="primary"
        onclick="savePromise()">
        保存する
      </button>

    </div>

  </div>


  <div id="promiseScreenshot" style="display:none">

    <button
      class="sub back"
      onclick="closePromiseScreenshot()">
      ← 戻る
    </button>

    <div class="title">📸 スクショ用</div>

    <div id="promiseScreenshotContent"></div>

  </div>

</section>

</main>


<script>

/* =====================================================
   データ
===================================================== */

const MAYOI_KEY="mayoiGoodsData";
const PROMISE_KEY="mayoiPromiseData";

let mayoiData=
  JSON.parse(localStorage.getItem(MAYOI_KEY)||"[]");

let promiseData=
  JSON.parse(localStorage.getItem(PROMISE_KEY)||"[]");

let editingMayoiId=null;
let editingPromiseId=null;


/* =====================================================
   あんスタ キャラクター
===================================================== */

const units={

  "fine":[
    ["天祥院英智","英智"],
    ["日々樹渉","渉"],
    ["姫宮桃李","桃李"],
    ["伏見弓弦","弓弦"]
  ],

  "Trickstar":[
    ["氷鷹北斗","北斗"],
    ["明星スバル","スバル"],
    ["遊木真","真"],
    ["衣更真緒","真緒"]
  ],

  "流星隊":[
    ["守沢千秋","千秋"],
    ["深海奏汰","奏汰"],
    ["南雲鉄虎","鉄虎"],
    ["高峯翠","翠"],
    ["仙石忍","忍"]
  ],

  "ALKALOID":[
    ["天城一彩","一彩"],
    ["白鳥藍良","藍良"],
    ["礼瀬マヨイ","マヨイ"],
    ["風早巽","巽"]
  ],

  "Eden":[
    ["乱凪砂","凪砂"],
    ["巴日和","日和"],
    ["七種茨","茨"],
    ["漣ジュン","ジュン"]
  ],

  "Valkyrie":[
    ["斎宮宗","宗"],
    ["影片みか","みか"]
  ],

  "2wink":[
    ["葵ひなた","ひなた"],
    ["葵ゆうた","ゆうた"]
  ],

  "Crazy:B":[
    ["天城燐音","燐音"],
    ["HiMERU","HiMERU"],
    ["桜河こはく","こはく"],
    ["椎名ニキ","ニキ"]
  ],

  "UNDEAD":[
    ["朔間零","零"],
    ["羽風薫","薫"],
    ["大神晃牙","晃牙"],
    ["乙狩アドニス","アドニス"]
  ],

  "Ra*bits":[
    ["真白友也","友也"],
    ["仁兎なずな","なずな"],
    ["天満光","光"],
    ["紫之創","創"]
  ],

  "紅月":[
    ["蓮巳敬人","敬人"],
    ["鬼龍紅郎","紅郎"],
    ["神崎颯馬","颯馬"]
  ],

  "Knights":[
    ["朱桜司","司"],
    ["月永レオ","レオ"],
    ["瀬名泉","泉"],
    ["朔間凛月","凛月"],
    ["鳴上嵐","嵐"]
  ],

  "Switch":[
    ["逆先夏目","夏目"],
    ["青葉つむぎ","つむぎ"],
    ["春川宙","宙"]
  ],

  "MaM":[
    ["三毛縞斑","斑"]
  ],

  "Double Face":[
    ["桜河こはく","こはく"],
    ["三毛縞斑","斑"]
  ],

  "Special for Princess!":[
    ["エス","エス"],
    ["カンナ","カンナ"],
    ["ユメ","ユメ"],
    ["ライカ","ライカ"]
  ],

  "MELLOW DEAR US":[
    ["小鹿ジュイス","ジュイス"],
    ["円果望見","望見"],
    ["久遠舞珠","舞珠"],
    ["甘楽チトセ","チトセ"]
  ]

};


/* =====================================================
   共通
===================================================== */

function saveLocal(){

  localStorage.setItem(
    MAYOI_KEY,
    JSON.stringify(mayoiData)
  );

  localStorage.setItem(
    PROMISE_KEY,
    JSON.stringify(promiseData)
  );

}


function showScreen(type){

  document.getElementById("mayoiScreen").classList.remove("active");
  document.getElementById("promiseScreen").classList.remove("active");
  document.getElementById("navMayoi").classList.remove("active");
  document.getElementById("navPromise").classList.remove("active");

  if(type==="mayoi"){

    document.getElementById("mayoiScreen").classList.add("active");
    document.getElementById("navMayoi").classList.add("active");
    renderMayoi();

  }else{

    document.getElementById("promiseScreen").classList.add("active");
    document.getElementById("navPromise").classList.add("active");
    renderPromise();

  }

}


/* =====================================================
   キャラ一覧
===================================================== */

function buildCharacterList(boxId,checkClass,onChange){

  const box=document.getElementById(boxId);

  box.innerHTML="";

  Object.entries(units).forEach(([unit,members])=>{

    const title=document.createElement("div");
    title.className="unit";
    title.textContent=unit;

    box.appendChild(title);

    const grid=document.createElement("div");
    grid.className="char-grid";

    members.forEach(([full,short])=>{

      const label=document.createElement("label");
      label.className="char";

      label.innerHTML=`

        <input
          type="checkbox"
          class="${checkClass}"
          data-full="${escapeHtml(full)}"
          data-short="${escapeHtml(short)}"
          onchange="${onChange}"
        >

        <span>${escapeHtml(short)}</span>

      `;

      grid.appendChild(label);

    });

    box.appendChild(grid);

  });

}


/* =====================================================
   迷子
===================================================== */

function renderCharacterList(){

  buildCharacterList(
    "characterList",
    "charCheck",
    "updateQuantities()"
  );

}

function selectAllMayoi(){

  document.querySelectorAll(".charCheck")
    .forEach(x=>x.checked=true);

  updateQuantities();

}

function clearAllMayoi(){

  document.querySelectorAll(".charCheck")
    .forEach(x=>x.checked=false);

  updateQuantities();

}


function updateQuantities(){

  const selected=[
    ...document.querySelectorAll(".charCheck:checked")
  ];

  const box=document.getElementById("quantityArea");

  if(selected.length===0){

    box.innerHTML="";
    return;

  }

  box.innerHTML=`

    <div class="quantity-title">
      所持数・再交換分
    </div>

    <div class="qty-head">

      <span>キャラ</span>
      <span>所持</span>
      <span>再交換</span>

    </div>

  `;

  selected.forEach(check=>{

    const short=check.dataset.short;

    const old=
      editingMayoiId
      ? mayoiData
        .find(x=>x.id===editingMayoiId)
        ?.characters
        ?.find(x=>x.short===short)
      : null;

    const row=document.createElement("div");

    row.className="qty-row";

    row.innerHTML=`

      <div class="name">
        ${escapeHtml(short)}
      </div>

      <input
        type="number"
        min="0"
        value="${old?.qty ?? 1}"
        data-qty="${escapeHtml(short)}"
      >

      <input
        type="number"
        min="0"
        value="${old?.retrade ?? 0}"
        data-retrade="${escapeHtml(short)}"
      >

    `;

    box.appendChild(row);

  });

}


function openMayoiForm(){

  editingMayoiId=null;

  document.getElementById("mayoiHome").style.display="none";
  document.getElementById("mayoiForm").style.display="block";
  document.getElementById("mayoiScreenshot").style.display="none";

  document.getElementById("mayoiFormTitle").textContent="迷子グッズを登録";
  document.getElementById("mayoiType").value="ぱしゃっつ";
  document.getElementById("mayoiImage").value="";
  document.getElementById("imagePreview").style.display="none";

  renderCharacterList();

  document.getElementById("quantityArea").innerHTML="";

}


function closeMayoiForm(){

  document.getElementById("mayoiForm").style.display="none";
  document.getElementById("mayoiHome").style.display="block";

  renderMayoi();

}


function previewMayoiImage(){

  const file=document.getElementById("mayoiImage").files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    const img=document.getElementById("imagePreview");

    img.src=e.target.result;
    img.style.display="block";

  };

  reader.readAsDataURL(file);

}


function saveMayoi(){

  const selected=[
    ...document.querySelectorAll(".charCheck:checked")
  ];

  if(selected.length===0){

    alert("持っているキャラを選んでね！");
    return;

  }

  const preview=document.getElementById("imagePreview");

  const old=
    editingMayoiId
    ? mayoiData.find(x=>x.id===editingMayoiId)
    : null;

  const image=
    preview.style.display!=="none"
    ? preview.src
    : old?.image || "";

  const characters=selected.map(check=>{

    const short=check.dataset.short;
    const full=check.dataset.full;

    const qty=Number(
      document.querySelector(
        `[data-qty="${cssEscape(short)}"]`
      )?.value || 0
    );

    const retrade=Number(
      document.querySelector(
        `[data-retrade="${cssEscape(short)}"]`
      )?.value || 0
    );

    return{
      full,
      short,
      qty,
      retrade
    };

  });

  const item={
    id:editingMayoiId || Date.now().toString(),
    type:document.getElementById("mayoiType").value,
    image,
    characters
  };

  if(editingMayoiId){

    const index=mayoiData.findIndex(x=>x.id===editingMayoiId);

    if(index!==-1)mayoiData[index]=item;

  }else{

    mayoiData.push(item);

  }

  saveLocal();

  alert("保存したよ！");
  closeMayoiForm();

}


function renderMayoi(){

  const box=document.getElementById("mayoiList");

  box.innerHTML="";

  if(mayoiData.length===0){

    box.innerHTML=`
      <div class="empty">
        まだ登録されてないよ
      </div>
    `;

    return;

  }

  mayoiData.forEach(item=>{

    const div=document.createElement("div");

    div.className="saved";

    const chips=item.characters.map(c=>`

      <span class="chip">

        ${escapeHtml(c.short)}
        ${c.qty}

        ${
          c.retrade
          ? `⑩${c.retrade}`
          : ""
        }

      </span>

    `).join("");

    div.innerHTML=`

      <div class="saved-top">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-actions">

/* =====================================================
   仮約束 数量
===================================================== */

function getPromisePurchaseQty(){

  return Number(
    document.getElementById("promisePurchaseQty")?.value || 0
  );

}


function updatePromiseDetail(){

  const selected=[
    ...document.querySelectorAll(".promiseCheck:checked")
  ];

  const box=document.getElementById("promiseDetail");

  box.innerHTML="";

  selected.forEach(check=>{

    const short=check.dataset.short;

    const old=
      editingPromiseId
      ? promiseData
        .find(x=>x.id===editingPromiseId)
        ?.characters
        ?.find(x=>x.short===short)
      : null;

    const row=document.createElement("div");

    row.className="promise-row";

    row.innerHTML=`

      <div>
        ${escapeHtml(short)}
      </div>

      <input
        type="number"
        min="0"
        value="${old?.promised ?? 0}"
        data-ppromise="${escapeHtml(short)}"
        oninput="updatePromiseRemaining('${escapeJs(short)}')"
      >

      <input
        type="number"
        value="${Math.max(
          0,
          getPromisePurchaseQty() -
          (old?.promised ?? 0)
        )}"
        data-premain="${escapeHtml(short)}"
        readonly
      >

      <input
        type="number"
        min="0"
        value="${old?.retrade ?? 0}"
        data-pretrade="${escapeHtml(short)}"
      >

    `;

    box.appendChild(row);

  });

}


function updatePromiseRemaining(short){

  const purchaseQty=getPromisePurchaseQty();

  const promised=Number(
    document.querySelector(
      `[data-ppromise="${cssEscape(short)}"]`
    )?.value || 0
  );

  const remain=document.querySelector(
    `[data-premain="${cssEscape(short)}"]`
  );

  if(remain){

    remain.value=Math.max(
      0,
      purchaseQty-promised
    );

  }

}


function updateAllPromiseRemaining(){

  document
    .querySelectorAll(".promiseCheck:checked")
    .forEach(check=>{

      updatePromiseRemaining(
        check.dataset.short
      );

    });

}


/* =====================================================
   仮約束 保存
===================================================== */

function savePromise(){

  const selected=[
    ...document.querySelectorAll(".promiseCheck:checked")
  ];

  if(selected.length===0){

    alert("持っているキャラを選んでね！");
    return;

  }

  const purchaseQty=getPromisePurchaseQty();

  if(purchaseQty<0){

    alert("購入数を確認してね！");
    return;

  }

  const old=
    editingPromiseId
    ? promiseData.find(
        x=>x.id===editingPromiseId
      )
    : null;

  const preview=document.getElementById("promiseImagePreview");

  const image=
    preview.style.display!=="none"
    ? preview.src
    : old?.image || "";

  const characters=selected.map(check=>{

    const short=check.dataset.short;
    const full=check.dataset.full;

    const promised=Number(
      document.querySelector(
        `[data-ppromise="${cssEscape(short)}"]`
      )?.value || 0
    );

    const retrade=Number(
      document.querySelector(
        `[data-pretrade="${cssEscape(short)}"]`
      )?.value || 0
    );

    return{

      full,
      short,
      qty:purchaseQty,
      promised,
      remaining:Math.max(
        0,
        purchaseQty-promised
      ),
      retrade

    };

  });

  const item={

    id:
      editingPromiseId ||
      Date.now().toString(),

    type:
      document.getElementById(
        "promiseType"
      ).value,

    image,

    purchaseQty,

    characters

  };

  if(editingPromiseId){

    const index=
      promiseData.findIndex(
        x=>x.id===editingPromiseId
      );

    if(index!==-1){
      promiseData[index]=item;
    }

  }else{

    promiseData.push(item);

  }

  saveLocal();

  alert("保存したよ！");
  closePromiseForm();

}


/* =====================================================
   仮約束 一覧
===================================================== */

function renderPromise(){

  const box=document.getElementById("promiseList");

  box.innerHTML="";

  if(promiseData.length===0){

    box.innerHTML=`
      <div class="empty">
        まだ登録されてないよ
      </div>
    `;

    return;

  }

  promiseData.forEach(item=>{

    const div=document.createElement("div");

    div.className="saved";

    /*
      新しいデータは purchaseQty を使用。
      古いデータが残っていても最初のキャラのqtyを
      購入数として読み込む。
    */
    const purchaseQty=
      Number(
        item.purchaseQty ??
        item.characters?.[0]?.qty ??
        0
      );

    let rows="";

    item.characters.forEach(c=>{

      const promised=Number(c.promised||0);

      const remaining=Math.max(
        0,
        purchaseQty-promised
      );

      rows+=`

        <div style="
          padding:7px 0;
          border-bottom:1px dotted #ddd;
          font-size:13px;
        ">

          <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
          ">

            <span>
              <b>${escapeHtml(c.short)}</b>
            </span>

            <span>
              約束 ${promised}
              ／残り <b>${remaining}</b>
            </span>

          </div>

          ${
            c.retrade
            ? `
              <div style="
                color:#888;
                font-size:11px;
                margin-top:3px;
              ">
                ⑩ 再交換分 ${c.retrade}
              </div>
            `
            : ""
          }

        </div>

      `;

    });

    div.innerHTML=`

      <div class="saved-top">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-actions">

          <button
            onclick="editPromise('${item.id}')">
            編集
          </button>

          <button
            onclick="deletePromise('${item.id}')">
            削除
          </button>

        </div>

      </div>

      ${
        item.image
        ? `
          <img
            src="${item.image}"
            class="saved-image">
        `
        : ""
      }

      <div style="
        margin-top:8px;
        font-size:12px;
        color:#777;
        font-weight:bold;
      ">
        購入数 ${purchaseQty}
      </div>

      <div style="margin-top:4px">
        ${rows}
      </div>

    `;

    box.appendChild(div);

  });

}

/* =====================================================
   安全処理
===================================================== */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function cssEscape(str){

  if(
    window.CSS &&
    CSS.escape
  ){

    return CSS.escape(str);

  }

  return String(str)
    .replace(/["\\]/g,"\\$&");

}
