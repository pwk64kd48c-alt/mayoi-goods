<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迷子グッズ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  background:#fff;
  padding:20px 15px 14px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:22px;
  letter-spacing:.08em;
}

.nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:#fff;
}

.nav button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px 5px;
  background:#e5e5e5;
  color:#555;
  font-weight:bold;
}

.nav button.active{
  background:#777;
  color:#fff;
}

main{
  max-width:720px;
  margin:auto;
  padding:15px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.title{
  font-size:19px;
  font-weight:bold;
  margin:5px 0 14px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:15px;
  padding:15px;
  margin-bottom:14px;
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#666;
  color:#fff;
  font-weight:bold;
}

.sub{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#eee;
  color:#555;
}

.full{
  width:100%;
}

.group{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input[type="number"],
select{
  width:100%;
  border:1px solid #ccc;
  border-radius:9px;
  padding:10px;
  background:#fff;
}

input[type="file"]{
  width:100%;
}

.preview{
  display:block;
  max-width:100%;
  max-height:260px;
  margin:10px auto 0;
  border-radius:8px;
  object-fit:contain;
}

.char-tools{
  display:flex;
  gap:7px;
  margin-bottom:10px;
}

.char-tools button{
  flex:1;
}

.unit{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 7px;
  padding-bottom:5px;
  border-bottom:1px solid #ddd;
}

.char-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.char{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fafafa;
  font-size:13px;
}

.char.selected{
  background:#eee;
  border-color:#999;
}

.char input{
  width:auto;
}

.quantity-title{
  margin:15px 0 7px;
  font-size:13px;
  font-weight:bold;
}

.qty-row{
  display:grid;
  grid-template-columns:1fr 75px 75px;
  gap:6px;
  align-items:center;
  margin-bottom:7px;
}

.qty-row .name{
  font-weight:bold;
  font-size:13px;
}

.qty-row input{
  text-align:center;
  padding:8px 4px;
}

.note{
  font-size:11px;
  color:#888;
  margin-bottom:8px;
}

.saved{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}

.saved-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.saved-type{
  font-weight:bold;
}

.saved-actions{
  display:flex;
  gap:5px;
}

.saved-actions button{
  border:0;
  border-radius:8px;
  padding:6px 9px;
  background:#eee;
  font-size:12px;
}

.saved-image{
  display:block;
  max-width:100%;
  max-height:150px;
  margin:10px auto;
  border-radius:7px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.chip{
  background:#eee;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}

.screenshot{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.ss-title{
  text-align:center;
  font-weight:bold;
  font-size:17px;
  margin-bottom:4px;
}

.legend{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-bottom:12px;
}

.ss-section{
  margin-bottom:15px;
}

.ss-type{
  font-weight:bold;
  font-size:13px;
  border-bottom:1px solid #ddd;
  padding-bottom:4px;
  margin-bottom:5px;
}

.ss-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px 15px;
}

.ss-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px dotted #ddd;
  padding:4px 0;
  font-size:12px;
}

.retrade{
  font-size:10px;
  margin-left:3px;
}

.promise-head,
.promise-row{
  display:grid;
  grid-template-columns:1fr 65px 65px 65px;
  gap:5px;
  align-items:center;
}

.promise-head{
  color:#888;
  font-size:10px;
  margin-bottom:5px;
}

.promise-row{
  margin-bottom:7px;
}

.promise-row input{
  width:100%;
  padding:8px 3px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:8px;
}

.promise-row input:last-child{
  background:#f1f1f1;
}

.back{
  margin-bottom:12px;
}
</style>
</head>

<body>

<header>
  <h1>迷子グッズ</h1>
</header>

<div class="nav">
  <button id="navMayoi" class="active" onclick="showScreen('mayoi')">
    🧸 迷子
  </button>

  <button id="navPromise" onclick="showScreen('promise')">
    🤝 仮約束
  </button>
</div>

<main>

<!-- =========================
     迷子
========================= -->

<section id="mayoiScreen" class="screen active">

  <div id="mayoiHome">

    <div class="title">🧸 迷子</div>

    <button class="primary" onclick="openMayoiForm()">
      ＋ 迷子グッズを登録
    </button>

    <div style="height:10px"></div>

    <button class="sub full" onclick="showMayoiScreenshot()">
      📸 スクショ用を見る
    </button>

    <div id="mayoiList"></div>

  </div>


  <div id="mayoiForm" style="display:none">

    <button class="sub back" onclick="closeMayoiForm()">
      ← 戻る
    </button>

    <div class="title" id="mayoiFormTitle">
      迷子グッズを登録
    </div>

    <div class="card">

      <div class="group">

        <label>グッズ種類</label>

        <select id="mayoiType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>

      </div>


      <div class="group">

        <label>グッズ画像</label>

        <input
          type="file"
          id="mayoiImage"
          accept="image/*"
          onchange="previewImage()"
        >

        <img
          id="imagePreview"
          class="preview"
          style="display:none"
        >

      </div>


      <div class="group">

        <label>キャラ</label>

        <div class="note">
          画像にいるキャラを選択してね。全員選択もできるよ！
        </div>

        <div class="char-tools">

          <button class="sub" onclick="selectAll()">
            ☑ 全員選択
          </button>

          <button class="sub" onclick="clearAll()">
            □ 全解除
          </button>

        </div>

        <div id="characterList"></div>

      </div>


      <div id="quantityArea"></div>


      <button class="primary" onclick="saveMayoi()">
        保存する
      </button>

    </div>

  </div>


  <div id="mayoiScreenshot" style="display:none">

    <button class="sub back" onclick="closeMayoiScreenshot()">
      ← 戻る
    </button>

    <div class="title">📸 スクショ用</div>

    <div id="mayoiScreenshotContent"></div>

  </div>

</section>


<!-- =========================
     仮約束
========================= -->

<section id="promiseScreen" class="screen">

  <div id="promiseHome">

    <div class="title">🤝 仮約束</div>

    <button class="primary" onclick="openPromiseForm()">
      ＋ 仮約束を登録
    </button>

    <div style="height:10px"></div>

    <button class="sub full" onclick="showPromiseScreenshot()">
      📸 スクショ用を見る
    </button>

    <div id="promiseList"></div>

  </div>


  <div id="promiseForm" style="display:none">

    <button class="sub back" onclick="closePromiseForm()">
      ← 戻る
    </button>

    <div class="title">
      仮約束を登録
    </div>

    <div class="card">

      <div class="group">

        <label>グッズ種類</label>

        <select id="promiseType">
          <option>ぱしゃっつ</option>
          <option>缶バッジ</option>
          <option>アクスタ</option>
          <option>チェキ</option>
          <option>カード</option>
          <option>ぬいぐるみ</option>
          <option>その他</option>
        </select>

      </div>


      <div class="group">

        <label>キャラ</label>

        <div id="promiseCharacterList"></div>

      </div>


      <div class="group">

        <div class="promise-head">
          <span>キャラ</span>
          <span>所持</span>
          <span>約束</span>
          <span>残り</span>
        </div>

        <div id="promiseDetail"></div>

      </div>


      <button class="primary" onclick="savePromise()">
        保存する
      </button>

    </div>

  </div>


  <div id="promiseScreenshot" style="display:none">

    <button class="sub back" onclick="closePromiseScreenshot()">
      ← 戻る
    </button>

    <div class="title">📸 スクショ用</div>

    <div id="promiseScreenshotContent"></div>

  </div>

</section>

</main>


<script>

/* =========================
   データ保存
========================= */

const MAYOI_KEY="mayoiGoodsData";
const PROMISE_KEY="mayoiPromiseData";

let mayoiData=
  JSON.parse(localStorage.getItem(MAYOI_KEY)||"[]");

let promiseData=
  JSON.parse(localStorage.getItem(PROMISE_KEY)||"[]");

let editingMayoiId=null;
let editingPromiseId=null;


/* =========================
   あんスタ キャラクター
========================= */

const units={

  "fine":[
    ["天祥院英智","英智"],
    ["日々樹渉","渉"],
    ["姫宮桃李","桃李"],
    ["伏見弓弦","弓弦"]
  ],

  "Trickstar":[
    ["氷鷹北斗","北斗"],
    ["明星スバル","スバル"],
    ["遊木真","真"],
    ["衣更真緒","真緒"]
  ],

  "流星隊":[
    ["守沢千秋","千秋"],
    ["深海奏汰","奏汰"],
    ["南雲鉄虎","鉄虎"],
    ["高峯翠","翠"],
    ["仙石忍","忍"]
  ],

  "ALKALOID":[
    ["天城一彩","一彩"],
    ["白鳥藍良","藍良"],
    ["礼瀬マヨイ","マヨイ"],
    ["風早巽","巽"]
  ],

  "Eden":[
    ["乱凪砂","凪砂"],
    ["巴日和","日和"],
    ["七種茨","茨"],
    ["漣ジュン","ジュン"]
  ],

  "Valkyrie":[
    ["斎宮宗","宗"],
    ["影片みか","みか"]
  ],

  "2wink":[
    ["葵ひなた","ひなた"],
    ["葵ゆうた","ゆうた"]
  ],

  "Crazy:B":[
    ["天城燐音","燐音"],
    ["HiMERU","HiMERU"],
    ["桜河こはく","こはく"],
    ["椎名ニキ","ニキ"]
  ],

  "UNDEAD":[
    ["朔間零","零"],
    ["羽風薫","薫"],
    ["大神晃牙","晃牙"],
    ["乙狩アドニス","アドニス"]
  ],

  "Ra*bits":[
    ["真白友也","友也"],
    ["仁兎なずな","なずな"],
    ["天満光","光"],
    ["紫之創","創"]
  ],

  "紅月":[
    ["蓮巳敬人","敬人"],
    ["鬼龍紅郎","紅郎"],
    ["神崎颯馬","颯馬"]
  ],

  "Knights":[
    ["朱桜司","司"],
    ["月永レオ","レオ"],
    ["瀬名泉","泉"],
    ["朔間凛月","凛月"],
    ["鳴上嵐","嵐"]
  ],

  "Switch":[
    ["逆先夏目","夏目"],
    ["青葉つむぎ","つむぎ"],
    ["春川宙","宙"]
  ],

  "MaM":[
    ["三毛縞斑","斑"]
  ],

  "Double Face":[
    ["桜河こはく","こはく"],
    ["三毛縞斑","斑"]
  ],

  "Special for Princess!":[
    ["エス","エス"],
    ["カンナ","カンナ"],
    ["ユメ","ユメ"],
    ["ライカ","ライカ"]
  ],

  "MELLOW DEAR US":[
    ["小鹿ジュイス","ジュイス"],
    ["円果望見","望見"],
    ["久遠舞珠","舞珠"],
    ["甘楽チトセ","チトセ"]
  ]

};


/* =========================
   全キャラを1つにする
========================= */

const allCharacters=[];

Object.entries(units).forEach(([unit,members])=>{

  members.forEach(([full,short])=>{

    if(!allCharacters.some(x=>x.full===full)){

      allCharacters.push({
        full:full,
        short:short
      });

    }

  });

});


/* =========================
   共通
========================= */

function saveLocal(){

  localStorage.setItem(
    MAYOI_KEY,
    JSON.stringify(mayoiData)
  );

  localStorage.setItem(
    PROMISE_KEY,
    JSON.stringify(promiseData)
  );

}


function showScreen(type){

  document
    .getElementById("mayoiScreen")
    .classList.remove("active");

  document
    .getElementById("promiseScreen")
    .classList.remove("active");

  document
    .getElementById("navMayoi")
    .classList.remove("active");

  document
    .getElementById("navPromise")
    .classList.remove("active");


  if(type==="mayoi"){

    document
      .getElementById("mayoiScreen")
      .classList.add("active");

    document
      .getElementById("navMayoi")
      .classList.add("active");

    renderMayoi();

  }else{

    document
      .getElementById("promiseScreen")
      .classList.add("active");

    document
      .getElementById("navPromise")
      .classList.add("active");

    renderPromise();

  }

}


/* =========================
   迷子 キャラ一覧
========================= */

function renderCharacterList(){

  const box=
    document.getElementById("characterList");

  box.innerHTML="";


  Object.entries(units).forEach(([unit,members])=>{

    const title=
      document.createElement("div");

    title.className="unit";
    title.textContent=unit;

    box.appendChild(title);


    const grid=
      document.createElement("div");

    grid.className="char-grid";


    members.forEach(([full,short])=>{

      const label=
        document.createElement("label");

      label.className="char";

      label.innerHTML=`

        <input
          type="checkbox"
          class="charCheck"
          data-full="${escapeHtml(full)}"
          data-short="${escapeHtml(short)}"
          onchange="updateQuantities()"
        >

        <span>${escapeHtml(short)}</span>

      `;

      grid.appendChild(label);

    });


    box.appendChild(grid);

  });

}


function selectAll(){

  document
    .querySelectorAll(".charCheck")
    .forEach(x=>x.checked=true);

  updateQuantities();

}


function clearAll(){

  document
    .querySelectorAll(".charCheck")
    .forEach(x=>x.checked=false);

  updateQuantities();

}


/* =========================
   数量欄
========================= */

function updateQuantities(){

  const selected=
    [...document.querySelectorAll(".charCheck:checked")];

  const box=
    document.getElementById("quantityArea");

  if(selected.length===0){

    box.innerHTML="";

    return;

  }


  box.innerHTML=`

    <div class="quantity-title">
      所持数・再交換分
    </div>

    <div class="note">
      ⑩＝再交換分
    </div>

  `;


  selected.forEach(check=>{

    const short=check.dataset.short;

    const old=
      editingMayoiId
      ? mayoiData
        .find(x=>x.id===editingMayoiId)
        ?.characters
        ?.find(x=>x.short===short)
      : null;


    const row=
      document.createElement("div");

    row.className="qty-row";


    row.innerHTML=`

      <div class="name">
        ${escapeHtml(short)}
      </div>

      <input
        type="number"
        min="0"
        value="${old?.qty ?? 1}"
        data-qty="${escapeHtml(short)}"
        placeholder="所持"
      >

      <input
        type="number"
        min="0"
        value="${old?.retrade ?? 0}"
        data-retrade="${escapeHtml(short)}"
        placeholder="再交換"
      >

    `;


    box.appendChild(row);

  });

}


/* =========================
   迷子 登録
========================= */

function openMayoiForm(){

  editingMayoiId=null;

  document
    .getElementById("mayoiHome")
    .style.display="none";

  document
    .getElementById("mayoiForm")
    .style.display="block";

  document
    .getElementById("mayoiScreenshot")
    .style.display="none";


  document
    .getElementById("mayoiFormTitle")
    .textContent="迷子グッズを登録";


  document
    .getElementById("mayoiType")
    .value="ぱしゃっつ";


  document
    .getElementById("mayoiImage")
    .value="";


  document
    .getElementById("imagePreview")
    .style.display="none";


  renderCharacterList();

  document
    .getElementById("quantityArea")
    .innerHTML="";

}


function closeMayoiForm(){

  document
    .getElementById("mayoiForm")
    .style.display="none";

  document
    .getElementById("mayoiHome")
    .style.display="block";

  renderMayoi();

}


function previewImage(){

  const file=
    document
      .getElementById("mayoiImage")
      .files[0];

  if(!file)return;


  const reader=
    new FileReader();


  reader.onload=function(e){

    const img=
      document.getElementById("imagePreview");

    img.src=e.target.result;

    img.style.display="block";

  };


  reader.readAsDataURL(file);

}


/* =========================
   迷子 保存
========================= */

function saveMayoi(){

  const selected=
    [...document.querySelectorAll(".charCheck:checked")];


  if(selected.length===0){

    alert("持っているキャラを選んでね！");

    return;

  }


  const preview=
    document.getElementById("imagePreview");


  const old=
    editingMayoiId
    ? mayoiData.find(x=>x.id===editingMayoiId)
    : null;


  const image=
    preview.style.display!=="none"
    ? preview.src
    : old?.image || "";


  const characters=
    selected.map(check=>{

      const short=
        check.dataset.short;

      const full=
        check.dataset.full;


      const qty=
        Number(
          document
            .querySelector(
              `[data-qty="${cssEscape(short)}"]`
            )?.value || 0
        );


      const retrade=
        Number(
          document
            .querySelector(
              `[data-retrade="${cssEscape(short)}"]`
            )?.value || 0
        );


      return {
        full:full,
        short:short,
        qty:qty,
        retrade:retrade
      };

    });


  const item={

    id:
      editingMayoiId ||
      Date.now().toString(),

    type:
      document.getElementById("mayoiType").value,

    image:image,

    characters:characters

  };


  if(editingMayoiId){

    const index=
      mayoiData.findIndex(
        x=>x.id===editingMayoiId
      );

    if(index!==-1){
      mayoiData[index]=item;
    }

  }else{

    mayoiData.push(item);

  }


  saveLocal();

  alert("保存したよ！");

  closeMayoiForm();

}


/* =========================
   迷子 一覧
========================= */

function renderMayoi(){

  const box=
    document.getElementById("mayoiList");

  box.innerHTML="";


  if(mayoiData.length===0){

    box.innerHTML=
      `<div class="empty">
        まだ登録されてないよ
      </div>`;

    return;

  }


  mayoiData.forEach(item=>{

    const div=
      document.createElement("div");

    div.className="saved";


    const chips=
      item.characters
        .map(c=>`

          <span class="chip">

            ${escapeHtml(c.short)}
            ${c.qty}

            ${
              c.retrade
              ? `⑩${c.retrade}`
              : ""
            }

          </span>

        `)
        .join("");


    div.innerHTML=`

      <div class="saved-top">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-actions">

          <button onclick="editMayoi('${item.id}')">
            編集
          </button>

          <button onclick="deleteMayoi('${item.id}')">
            削除
          </button>

        </div>

      </div>


      ${
        item.image
        ? `<img src="${item.image}" class="saved-image">`
        : ""
      }


      <div class="chips">
        ${chips}
      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================
   迷子 編集
========================= */

function editMayoi(id){

  const item=
    mayoiData.find(x=>x.id===id);

  if(!item)return;


  editingMayoiId=id;


  document
    .getElementById("mayoiHome")
    .style.display="none";

  document
    .getElementById("mayoiForm")
    .style.display="block";


  document
    .getElementById("mayoiFormTitle")
    .textContent="迷子グッズを編集";


  document
    .getElementById("mayoiType")
    .value=item.type;


  if(item.image){

    const img=
      document.getElementById("imagePreview");

    img.src=item.image;

    img.style.display="block";

  }


  renderCharacterList();


  document
    .querySelectorAll(".charCheck")
    .forEach(check=>{

      if(
        item.characters.some(
          c=>c.short===check.dataset.short
        )
      ){
        check.checked=true;
      }

    });


  updateQuantities();

}


/* =========================
   迷子 削除
========================= */

function deleteMayoi(id){

  if(
    !confirm("この迷子グッズを削除する？")
  )return;


  mayoiData=
    mayoiData.filter(
      x=>x.id!==id
    );


  saveLocal();

  renderMayoi();

}

/* =========================
   仮約束
========================= */

function openPromiseForm(){

  editingPromiseId=null;

  document
    .getElementById("promiseHome")
    .style.display="none";

  document
    .getElementById("promiseForm")
    .style.display="block";

  renderPromiseCharacters();

}


function closePromiseForm(){

  document
    .getElementById("promiseForm")
    .style.display="none";

  document
    .getElementById("promiseHome")
    .style.display="block";

  renderPromise();

}


/* =========================
   仮約束 キャラ選択
========================= */

function renderPromiseCharacters(){

  const box=
    document.getElementById(
      "promiseCharacterList"
    );

  box.innerHTML="";


  Object.entries(units).forEach(
    ([unit,members])=>{

      const title=
        document.createElement("div");

      title.className="unit";
      title.textContent=unit;

      box.appendChild(title);


      const grid=
        document.createElement("div");

      grid.className="char-grid";


      members.forEach(
        ([full,short])=>{

          const label=
            document.createElement("label");

          label.className="char";


          label.innerHTML=`

            <input
              type="checkbox"
              class="promiseCheck"
              data-full="${escapeHtml(full)}"
              data-short="${escapeHtml(short)}"
              onchange="updatePromiseDetail()"
            >

            <span>
              ${escapeHtml(short)}
            </span>

          `;


          grid.appendChild(label);

        }
      );


      box.appendChild(grid);

    }
  );

}


/* =========================
   仮約束 数量
========================= */

function updatePromiseDetail(){

  const selected=
    [
      ...document.querySelectorAll(
        ".promiseCheck:checked"
      )
    ];


  const box=
    document.getElementById(
      "promiseDetail"
    );

  box.innerHTML="";


  selected.forEach(check=>{

    const short=
      check.dataset.short;


    const old=
      editingPromiseId
      ? promiseData
        .find(x=>x.id===editingPromiseId)
        ?.characters
        ?.find(x=>x.short===short)
      : null;


    const row=
      document.createElement("div");

    row.className="promise-row";


    row.innerHTML=`

      <div>
        ${escapeHtml(short)}
      </div>

      <input
        type="number"
        min="0"
        value="${old?.qty ?? 0}"
        data-pqty="${escapeHtml(short)}"
      >

      <input
        type="number"
        min="0"
        value="${old?.promised ?? 0}"
        data-ppromise="${escapeHtml(short)}"
        oninput="updateRemaining('${escapeJs(short)}')"
      >

      <input
        type="number"
        value="${Math.max(
          0,
          (old?.qty ?? 0) -
          (old?.promised ?? 0)
        )}"
        data-premain="${escapeHtml(short)}"
        readonly
      >

    `;


    box.appendChild(row);

  });

}


function updateRemaining(short){

  const qty=
    Number(
      document
        .querySelector(
          `[data-pqty="${cssEscape(short)}"]`
        )?.value || 0
    );


  const promised=
    Number(
      document
        .querySelector(
          `[data-ppromise="${cssEscape(short)}"]`
        )?.value || 0
    );


  const remain=
    document
      .querySelector(
        `[data-premain="${cssEscape(short)}"]`
      );


  if(remain){

    remain.value=
      Math.max(
        0,
        qty-promised
      );

  }

}


/* =========================
   仮約束 保存
========================= */

function savePromise(){

  const selected=
    [
      ...document.querySelectorAll(
        ".promiseCheck:checked"
      )
    ];


  if(selected.length===0){

    alert("キャラを選んでね！");

    return;

  }


  const characters=
    selected.map(check=>{

      const short=
        check.dataset.short;

      const full=
        check.dataset.full;


      const qty=
        Number(
          document
            .querySelector(
              `[data-pqty="${cssEscape(short)}"]`
            )?.value || 0
        );


      const promised=
        Number(
          document
            .querySelector(
              `[data-ppromise="${cssEscape(short)}"]`
            )?.value || 0
        );


      return{

        full:full,
        short:short,
        qty:qty,
        promised:promised,
        remaining:Math.max(
          0,
          qty-promised
        )

      };

    });


  const item={

    id:
      editingPromiseId ||
      Date.now().toString(),

    type:
      document.getElementById(
        "promiseType"
      ).value,

    characters:characters

  };


  if(editingPromiseId){

    const index=
      promiseData.findIndex(
        x=>x.id===editingPromiseId
      );

    if(index!==-1){
      promiseData[index]=item;
    }

  }else{

    promiseData.push(item);

  }


  saveLocal();

  alert("保存したよ！");

  closePromiseForm();

}


/* =========================
   仮約束 一覧
========================= */

function renderPromise(){

  const box=
    document.getElementById(
      "promiseList"
    );

  box.innerHTML="";


  if(promiseData.length===0){

    box.innerHTML=
      `<div class="empty">
        まだ登録されてないよ
      </div>`;

    return;

  }


  promiseData.forEach(item=>{

    const div=
      document.createElement("div");

    div.className="saved";


    let rows="";


    item.characters.forEach(c=>{

      rows+=`

        <div style="
          display:flex;
          justify-content:space-between;
          padding:6px 0;
          border-bottom:1px dotted #ddd;
          font-size:13px;
        ">

          <span>
            ${escapeHtml(c.short)}
          </span>

          <span>
            ${c.qty}
            →
            ${c.promised}
            →
            <b>${c.remaining}</b>
          </span>

        </div>

      `;

    });


    div.innerHTML=`

      <div class="saved-top">

        <div class="saved-type">
          ${escapeHtml(item.type)}
        </div>

        <div class="saved-actions">

          <button onclick="editPromise('${item.id}')">
            編集
          </button>

          <button onclick="deletePromise('${item.id}')">
            削除
          </button>

        </div>

      </div>

      <div style="margin-top:8px">
        ${rows}
      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================
   仮約束 編集
========================= */

function editPromise(id){

  const item=
    promiseData.find(
      x=>x.id===id
    );

  if(!item)return;


  editingPromiseId=id;


  document
    .getElementById("promiseHome")
    .style.display="none";

  document
    .getElementById("promiseForm")
    .style.display="block";


  document
    .getElementById("promiseType")
    .value=item.type;


  renderPromiseCharacters();


  document
    .querySelectorAll(".promiseCheck")
    .forEach(check=>{

      if(
        item.characters.some(
          c=>c.short===check.dataset.short
        )
      ){

        check.checked=true;

      }

    });


  updatePromiseDetail();

}


/* =========================
   仮約束 削除
========================= */

function deletePromise(id){

  if(
    !confirm("この仮約束を削除する？")
  )return;


  promiseData=
    promiseData.filter(
      x=>x.id!==id
    );


  saveLocal();

  renderPromise();

}

/* =========================
   安全処理
========================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function cssEscape(str){

  if(
    window.CSS &&
    CSS.escape
  ){

    return CSS.escape(str);

  }

  return String(str)
    .replace(/["\\]/g,"\\$&");

}

renderMayoi();
renderPromise();
