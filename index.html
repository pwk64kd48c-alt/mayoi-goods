<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>迷子グッズ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f6;color:#444;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:#fff;padding:20px 15px 14px;text-align:center;border-bottom:1px solid #ddd}
header h1{margin:0;font-size:22px;letter-spacing:.08em}
.nav{display:flex;gap:8px;padding:12px;background:#fff}
.nav button{flex:1;border:0;border-radius:12px;padding:12px 5px;background:#e5e5e5;color:#555;font-weight:bold}
.nav button.active{background:#777;color:#fff}
main{max-width:720px;margin:auto;padding:15px}
.screen{display:none}
.screen.active{display:block}
.title{font-size:19px;font-weight:bold;margin:5px 0 14px}
.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:15px;margin-bottom:14px}
.primary{width:100%;border:0;border-radius:11px;padding:13px;background:#666;color:#fff;font-weight:bold}
.sub{border:0;border-radius:9px;padding:9px 12px;background:#eee;color:#555}
.full{width:100%}
.group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
input[type="number"],select{width:100%;border:1px solid #ccc;border-radius:9px;padding:10px;background:#fff}
input[type="file"]{width:100%}
.preview{display:block;max-width:100%;max-height:260px;margin:10px auto 0;border-radius:8px;object-fit:contain}
.char-tools{display:flex;gap:7px;margin-bottom:10px}
.char-tools button{flex:1}
.unit{margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid #ddd;font-size:13px;font-weight:bold}
.char-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.char{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid #ddd;border-radius:9px;background:#fafafa;font-size:13px}
.char.selected{background:#eee;border-color:#999}
.char input{width:auto}
.quantity-title{margin:15px 0 7px;font-size:13px;font-weight:bold}
.qty-head,.qty-row{display:grid;grid-template-columns:1fr 75px 75px;gap:6px;align-items:center}
.qty-head{color:#888;font-size:10px;margin-bottom:5px}
.qty-row{margin-bottom:7px}
.qty-row .name{font-weight:bold;font-size:13px}
.qty-row input{text-align:center;padding:8px 4px}
.note{font-size:11px;color:#888;margin-bottom:8px}
.saved{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-top:12px}
.saved-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.saved-type{font-weight:bold}
.saved-actions{display:flex;gap:5px}
.saved-actions button{border:0;border-radius:8px;padding:6px 9px;background:#eee;font-size:12px}
.saved-image{display:block;max-width:100%;max-height:150px;margin:10px auto;border-radius:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#eee;border-radius:20px;padding:4px 8px;font-size:11px}
.empty{text-align:center;color:#999;padding:30px 10px}
.screenshot{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}
.ss-title{text-align:center;font-weight:bold;font-size:17px;margin-bottom:10px}
.ss-section{margin-bottom:14px}
.ss-type{font-weight:bold;font-size:13px;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:3px}
.ss-legend{color:#777;font-size:10px;margin:3px 0 6px}
.ss-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 7px}
.ss-grid.cols4,.ss-grid.cols3{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 7px}
/* スクショの画像まわりの余白を抑え、縦長になりすぎないようにする */
.ss-image{display:block;width:100%;height:150px;object-fit:contain;margin:4px auto 7px;border-radius:6px}
.ss-row{display:flex;justify-content:space-between;align-items:baseline;gap:2px;min-width:0;border-bottom:1px dotted #ddd;padding:3px 0;font-size:11px}
.ss-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss-quantity{flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.retrade{font-size:10px;margin-left:3px;color:#777}
.promise-head,.promise-row{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;align-items:center}
.promise-head{color:#888;font-size:10px;margin-bottom:5px}
.promise-row{margin-bottom:7px}
.promise-row input{width:100%;padding:8px 3px;text-align:center;border:1px solid #ccc;border-radius:8px}
.promise-row input[data-premain]{background:#f1f1f1}
.purchase-box{background:#f7f7f7;border:1px solid #ddd;border-radius:11px;padding:12px}
.purchase-box label{margin-bottom:7px}
.purchase-box input{text-align:center;font-size:17px;font-weight:bold}
.back{margin-bottom:12px}
@media(max-width:430px){
.promise-head,.promise-row{grid-template-columns:1fr 52px 52px 52px;gap:4px}
.promise-row input{padding:7px 1px;font-size:12px}
.promise-head{font-size:9px}
.ss-grid,.ss-grid.cols4,.ss-grid.cols3{grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 5px}
.ss-row{font-size:10px}
.ss-quantity{font-size:10px}
.ss-image{height:130px}
}
</style>
</head>
<body>
<header><h1>迷子グッズ</h1></header>
<div class="nav">
<button id="navMayoi" class="active" onclick="showScreen('mayoi')">🧸 迷子</button>
<button id="navPromise" onclick="showScreen('promise')">🤝 仮約束</button>
</div>
<main>
<section id="mayoiScreen" class="screen active">
<div id="mayoiHome">
<div class="title">🧸 迷子</div>
<button class="primary" onclick="openMayoiForm()">＋ 迷子グッズを登録</button>
<div style="height:10px"></div>
<button class="sub full" onclick="showMayoiScreenshot()">📸 スクショ用を見る</button>
<div id="mayoiList"></div>
</div>
<div id="mayoiForm" style="display:none">
<button class="sub back" onclick="closeMayoiForm()">← 戻る</button>
<div class="title" id="mayoiFormTitle">迷子グッズを登録</div>
<div class="card">
<div class="group">
<label>グッズ種類</label>
<select id="mayoiType">
<option>ぱしゃっつ</option><option>缶バッジ</option><option>アクスタ</option><option>チェキ</option><option>カード</option><option>ぬいぐるみ</option><option>その他</option>
</select>
</div>
<div class="group">
<label>グッズ画像</label>
<input type="file" id="mayoiImage" accept="image/*" onchange="previewImage('mayoiImage','imagePreview')">
<img id="imagePreview" class="preview" style="display:none">
</div>
<div class="group">
<label>キャラ</label>
<div class="note">画像にいるキャラを選択してね。全員選択もできるよ！</div>
<div class="char-tools">
<button class="sub" onclick="selectAll('characterList')">☑ 全員選択</button>
<button class="sub" onclick="clearAll('characterList')">□ 全解除</button>
</div>
<div id="characterList"></div>
</div>
<div id="quantityArea"></div>
<button class="primary" onclick="saveMayoi()">保存する</button>
</div>
</div>
<div id="mayoiScreenshot" style="display:none">
<button class="sub back" onclick="closeMayoiScreenshot()">← 戻る</button>
<div class="title">📸 スクショ用</div>
<div id="mayoiScreenshotContent"></div>
</div>
</section>
<section id="promiseScreen" class="screen">
<div id="promiseHome">
<div class="title">🤝 仮約束</div>
<button class="primary" onclick="openPromiseForm()">＋ 仮約束を登録</button>
<div style="height:10px"></div>
<button class="sub full" onclick="showPromiseScreenshot()">📸 スクショ用を見る</button>
<div id="promiseList"></div>
</div>
<div id="promiseForm" style="display:none">
<button class="sub back" onclick="closePromiseForm()">← 戻る</button>
<div class="title" id="promiseFormTitle">仮約束を登録</div>
<div class="card">
<div class="group">
<label>グッズ種類</label>
<select id="promiseType">
<option>ぱしゃっつ</option><option>缶バッジ</option><option>アクスタ</option><option>チェキ</option><option>カード</option><option>ぬいぐるみ</option><option>その他</option>
</select>
</div>
<div class="group">
<label>グッズ画像</label>
<input type="file" id="promiseImage" accept="image/*" onchange="previewImage('promiseImage','promiseImagePreview')">
<img id="promiseImagePreview" class="preview" style="display:none">
</div>
<div class="group purchase-box">
<label>購入数</label>
<input type="number" id="promisePurchaseQty" min="0" value="1" oninput="updateAllPromiseRemaining()">
</div>
<div class="group">
<label>キャラ</label>
<div class="note">画像にいるキャラを選択してね。全員選択もできるよ！</div>
<div class="char-tools">
<button class="sub" onclick="selectAll('promiseCharacterList')">☑ 全員選択</button>
<button class="sub" onclick="clearAll('promiseCharacterList')">□ 全解除</button>
</div>
<div id="promiseCharacterList"></div>
</div>
<div class="group">
<div class="promise-head"><span>キャラ</span><span>約束</span><span>残り</span><span>再交換</span></div>
<div id="promiseDetail"></div>
</div>
<button class="primary" onclick="savePromise()">保存する</button>
</div>
</div>
<div id="promiseScreenshot" style="display:none">
<button class="sub back" onclick="closePromiseScreenshot()">← 戻る</button>
<div class="title">📸 スクショ用</div>
<div id="promiseScreenshotContent"></div>
</div>
</section>
</main>
<script>
const MAYOI_KEY="mayoiGoodsData";
const PROMISE_KEY="mayoiPromiseData";

let mayoiData=loadData(MAYOI_KEY);
let promiseData=loadData(PROMISE_KEY);
let editingMayoiId=null;
let editingPromiseId=null;

const units={
"fine":[["天祥院英智","英智"],["日々樹渉","渉"],["姫宮桃李","桃李"],["伏見弓弦","弓弦"]],
"Trickstar":[["氷鷹北斗","北斗"],["明星スバル","スバル"],["遊木真","真"],["衣更真緒","真緒"]],
"流星隊":[["守沢千秋","千秋"],["深海奏汰","奏汰"],["南雲鉄虎","鉄虎"],["高峯翠","翠"],["仙石忍","忍"]],
"ALKALOID":[["天城一彩","一彩"],["白鳥藍良","藍良"],["礼瀬マヨイ","マヨイ"],["風早巽","巽"]],
"Eden":[["乱凪砂","凪砂"],["巴日和","日和"],["七種茨","茨"],["漣ジュン","ジュン"]],
"Valkyrie":[["斎宮宗","宗"],["影片みか","みか"]],
"2wink":[["葵ひなた","ひなた"],["葵ゆうた","ゆうた"]],
"Crazy:B":[["天城燐音","燐音"],["HiMERU","HiMERU"],["桜河こはく","こはく"],["椎名ニキ","ニキ"]],
"UNDEAD":[["朔間零","零"],["羽風薫","薫"],["大神晃牙","晃牙"],["乙狩アドニス","アドニス"]],
"Ra*bits":[["真白友也","友也"],["仁兎なずな","なずな"],["天満光","光"],["紫之創","創"]],
"紅月":[["蓮巳敬人","敬人"],["鬼龍紅郎","紅郎"],["神崎颯馬","颯馬"],["滝維吹","維吹"]],
"Knights":[["朱桜司","司"],["月永レオ","レオ"],["瀬名泉","泉"],["朔間凛月","凛月"],["鳴上嵐","嵐"]],
"Switch":[["逆先夏目","夏目"],["青葉つむぎ","つむぎ"],["春川宙","宙"]],
"MaM":[["三毛縞斑","斑"]],
"Double Face":[["桜河こはく","こはく"],["三毛縞斑","斑"]],
"Special for Princess!":[["エス","エス"],["カンナ","カンナ"],["ユメ","ユメ"],["ライカ","ライカ"]],
"MELLOW DEAR US":[["小鹿ジュイス","ジュイス"],["円果望見","望見"],["久遠舞珠","舞珠"],["甘楽チトセ","チトセ"]]
};

function loadData(key){
 try{return JSON.parse(localStorage.getItem(key)||"[]");}
 catch(e){return [];}
}
function saveLocal(){
 localStorage.setItem(MAYOI_KEY,JSON.stringify(mayoiData));
 localStorage.setItem(PROMISE_KEY,JSON.stringify(promiseData));
}
function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 })[c]);
}
function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function compressImage(data){
 return new Promise((resolve,reject)=>{
  if(!data){resolve("");return;}
  const img=new Image();
  img.onload=()=>{
   let w=img.naturalWidth,h=img.naturalHeight;
   const max=900;
   if(w>max||h>max){
    if(w>=h){h=Math.round(h*max/w);w=max;}
    else{w=Math.round(w*max/h);h=max;}
   }
   const canvas=document.createElement("canvas");
   canvas.width=w;canvas.height=h;
   canvas.getContext("2d").drawImage(img,0,0,w,h);
   resolve(canvas.toDataURL("image/jpeg",0.75));
  };
  img.onerror=reject;img.src=data;
 });
}
function fileToDataUrl(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve("");return;}
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}
function previewImage(inputId,previewId){
 const file=document.getElementById(inputId).files[0];
 if(!file)return;
 const r=new FileReader();
 r.onload=e=>{
  const p=document.getElementById(previewId);
  p.src=e.target.result;p.style.display="block";
 };
 r.readAsDataURL(file);
}
function showScreen(type){
 const mayoi=type==="mayoi";
 document.getElementById("mayoiScreen").classList.toggle("active",mayoi);
 document.getElementById("promiseScreen").classList.toggle("active",!mayoi);
 document.getElementById("navMayoi").classList.toggle("active",mayoi);
 document.getElementById("navPromise").classList.toggle("active",!mayoi);
 closeMayoiForm();closeMayoiScreenshot();
 closePromiseForm();closePromiseScreenshot();
 renderMayoiList();renderPromiseList();
}
function renderCharacterList(containerId,selected=[]){
 const box=document.getElementById(containerId);
 let html="";
 Object.entries(units).forEach(([unit,chars])=>{
  html+=`<div class="unit">${escapeHtml(unit)}</div><div class="char-grid">`;
  chars.forEach(([full,short])=>{
   const checked=selected.includes(full);
   html+=`<label class="char ${checked?"selected":""}">
   <input type="checkbox" value="${escapeHtml(full)}"
   data-short="${escapeHtml(short)}" ${checked?"checked":""}
   onchange="characterChanged(this,'${containerId}')">
   <span>${escapeHtml(short)}</span></label>`;
  });
  html+="</div>";
 });
 box.innerHTML=html;
 if(containerId==="characterList")updateQuantityArea();
 else updatePromiseDetail();
}
function characterChanged(input,containerId){
 input.closest(".char").classList.toggle("selected",input.checked);
 if(containerId==="characterList")updateQuantityArea();
 else updatePromiseDetail();
}
function getSelectedCharacters(containerId){
 return [...document.querySelectorAll(`#${containerId} input:checked`)]
 .map(i=>({full:i.value,short:i.dataset.short}));
}
function selectAll(containerId){
 document.querySelectorAll(`#${containerId} input[type=checkbox]`)
 .forEach(i=>{i.checked=true;i.closest(".char").classList.add("selected");});
 if(containerId==="characterList")updateQuantityArea();
 else updatePromiseDetail();
}
function clearAll(containerId){
 document.querySelectorAll(`#${containerId} input[type=checkbox]`)
 .forEach(i=>{i.checked=false;i.closest(".char").classList.remove("selected");});
 if(containerId==="characterList")updateQuantityArea();
 else updatePromiseDetail();
}
function selectAllMayoi(){selectAll("characterList");}
function clearAllMayoi(){clearAll("characterList");}
function selectAllPromise(){selectAll("promiseCharacterList");}
function clearAllPromise(){clearAll("promiseCharacterList");}

/* 迷子 登録・編集 */
function openMayoiForm(){
 editingMayoiId=null;
 document.getElementById("mayoiHome").style.display="none";
 document.getElementById("mayoiScreenshot").style.display="none";
 document.getElementById("mayoiForm").style.display="block";
 document.getElementById("mayoiFormTitle").textContent="迷子グッズを登録";
 document.getElementById("mayoiType").value="ぱしゃっつ";
 document.getElementById("mayoiImage").value="";
 document.getElementById("imagePreview").style.display="none";
 document.getElementById("imagePreview").src="";
 renderCharacterList("characterList",[]);
}
function closeMayoiForm(){
 document.getElementById("mayoiForm").style.display="none";
 document.getElementById("mayoiHome").style.display="block";
 renderMayoiList();
}
function updateQuantityArea(existing=[]){
 const selected=getSelectedCharacters("characterList");
 const area=document.getElementById("quantityArea");
 if(!selected.length){area.innerHTML="";return;}
 const oldMap={};
 existing.forEach(c=>oldMap[c.full]=c);
 area.innerHTML=`<div class="quantity-title">所持数・再交換数</div>
 <div class="qty-head"><span>キャラ</span><span>所持</span><span>再交換</span></div>`+
 selected.map(c=>{
  const old=oldMap[c.full]||{};
  return `<div class="qty-row"><span class="name">${escapeHtml(c.short)}</span>
  <input type="number" min="0" value="${Number(old.qty)||0}" data-qty>
  <input type="number" min="0" value="${Number(old.retrade)||0}" data-retrade></div>`;
 }).join("");
}
async function saveMayoi(){
 const selected=getSelectedCharacters("characterList");
 if(!selected.length){alert("キャラを1人以上選択してね！");return;}
 const rows=[...document.querySelectorAll("#quantityArea .qty-row")];
 const characters=selected.map((c,i)=>({
  ...c,
  qty:Math.max(0,Number(rows[i]?.querySelector("[data-qty]")?.value)||0),
  retrade:Math.max(0,Number(rows[i]?.querySelector("[data-retrade]")?.value)||0)
 }));
 const old=mayoiData.find(x=>x.id===editingMayoiId);
 let image=old?.image||"";
 const file=document.getElementById("mayoiImage").files[0];
 if(file)image=await compressImage(await fileToDataUrl(file));
 const item={id:editingMayoiId||uid(),type:document.getElementById("mayoiType").value,image,characters};
 const index=mayoiData.findIndex(x=>x.id===item.id);
 if(index>=0)mayoiData[index]=item;else mayoiData.push(item);
 saveLocal();editingMayoiId=null;alert("保存したよ！");closeMayoiForm();
}
function editMayoi(id){
 const item=mayoiData.find(x=>x.id===id);if(!item)return;
 editingMayoiId=id;
 document.getElementById("mayoiHome").style.display="none";
 document.getElementById("mayoiForm").style.display="block";
 document.getElementById("mayoiScreenshot").style.display="none";
 document.getElementById("mayoiFormTitle").textContent="迷子グッズを編集";
 document.getElementById("mayoiType").value=item.type;
 document.getElementById("mayoiImage").value="";
 const p=document.getElementById("imagePreview");
 p.src=item.image||"";p.style.display=item.image?"block":"none";
 renderCharacterList("characterList",(item.characters||[]).map(c=>c.full));
 updateQuantityArea(item.characters||[]);
}
function deleteMayoi(id){
 if(!confirm("この迷子グッズを削除する？"))return;
 mayoiData=mayoiData.filter(x=>x.id!==id);saveLocal();renderMayoiList();
}
function renderMayoiList(){
 const box=document.getElementById("mayoiList");
 if(!mayoiData.length){box.innerHTML='<div class="empty">まだ登録がないよ</div>';return;}
 box.innerHTML=mayoiData.map(item=>`
 <div class="saved"><div class="saved-top"><div class="saved-type">${escapeHtml(item.type)}</div>
 <div class="saved-actions"><button onclick="editMayoi('${item.id}')">編集</button>
 <button onclick="deleteMayoi('${item.id}')">削除</button></div></div>
 ${item.image?`<img src="${item.image}" class="saved-image">`:""}
 <div class="chips">${(item.characters||[]).map(c=>`<span class="chip">${escapeHtml(c.short)} ${Number(c.qty)||0}${Number(c.retrade)?` ★${Number(c.retrade)}`:""}</span>`).join("")}</div></div>`).join("");
}

/* スクショ表示 */
function getScreenshotGridClass(type){
 return "cols4";
}
function makeScreenshot(data,title,isPromise){
 if(!data.length)return '<div class="empty">まだ登録がないよ</div>';

 const sections=data.map(item=>{
  const purchase=Number(item.purchaseQty??item.characters?.[0]?.qty??0);

  /* 表示用の数量を計算。保存済みデータは変更しない */
  const visibleCharacters=(item.characters||[]).map(c=>{
   const qty=isPromise
    ?Math.max(0,purchase-Number(c.promised||0))
    :Math.max(0,Number(c.qty)||0);

   return {...c,displayQty:qty};
  }).filter(c=>c.displayQty>0);

  /* 表示するキャラがいないグッズは非表示 */
  if(!visibleCharacters.length)return "";

  return `<div class="ss-section">
   <div class="ss-type">${escapeHtml(item.type)}</div>
   <div class="ss-legend">★ 再交換分</div>
   ${item.image?`<img src="${item.image}" class="ss-image">`:""}
   <div class="ss-grid cols4">
   ${visibleCharacters.map(c=>{
    const retrade=Math.max(0,Number(c.retrade)||0);
    return `<div class="ss-row">
      <span class="ss-name">${escapeHtml(c.short)}</span>
      <span class="ss-quantity">${c.displayQty}${retrade>0?`<span class="retrade">★${retrade}</span>`:""}</span>
    </div>`;
   }).join("")}
   </div>
  </div>`;
 }).join("");

 if(!sections.trim()){
  return '<div class="empty">表示できるグッズがないよ（数量0のキャラは非表示）</div>';
 }

 return `<div class="screenshot"><div class="ss-title">${escapeHtml(title)}</div>${sections}</div>`;
}
function showMayoiScreenshot(){
 document.getElementById("mayoiHome").style.display="none";
 document.getElementById("mayoiForm").style.display="none";
 document.getElementById("mayoiScreenshot").style.display="block";
 document.getElementById("mayoiScreenshotContent").innerHTML=makeScreenshot(mayoiData,"迷子グッズ",false);
}
function closeMayoiScreenshot(){
 document.getElementById("mayoiScreenshot").style.display="none";
 document.getElementById("mayoiHome").style.display="block";
 renderMayoiList();
}

/* 仮約束 登録・編集 */
function openPromiseForm(){
 editingPromiseId=null;
 document.getElementById("promiseHome").style.display="none";
 document.getElementById("promiseScreenshot").style.display="none";
 document.getElementById("promiseForm").style.display="block";
 document.getElementById("promiseFormTitle").textContent="仮約束を登録";
 document.getElementById("promiseType").value="ぱしゃっつ";
 document.getElementById("promisePurchaseQty").value=1;
 document.getElementById("promiseImage").value="";
 const p=document.getElementById("promiseImagePreview");
 p.src="";p.style.display="none";
 renderCharacterList("promiseCharacterList",[]);
}
function closePromiseForm(){
 document.getElementById("promiseForm").style.display="none";
 document.getElementById("promiseHome").style.display="block";
 renderPromiseList();
}
function updatePromiseDetail(existing=[]){
 const selected=getSelectedCharacters("promiseCharacterList");
 const area=document.getElementById("promiseDetail");
 if(!selected.length){area.innerHTML="";return;}
 const oldMap={};existing.forEach(c=>oldMap[c.full]=c);
 const purchase=Math.max(0,Number(document.getElementById("promisePurchaseQty").value)||0);

 area.innerHTML=selected.map(c=>{
  const old=oldMap[c.full]||{};
  const promised=Number(old.promised)||0;
  return `<div class="promise-row"><span class="name">${escapeHtml(c.short)}</span>
  <input type="number" min="0" value="${promised}" data-promised oninput="updateAllPromiseRemaining()">
  <input type="number" min="0" value="${Math.max(0,purchase-promised)}" data-premain readonly>
  <input type="number" min="0" value="${Number(old.retrade)||0}" data-retrade></div>`;
 }).join("");
}
function updateAllPromiseRemaining(){
 const purchase=Math.max(0,Number(document.getElementById("promisePurchaseQty").value)||0);
 document.querySelectorAll("#promiseDetail .promise-row").forEach(row=>{
  const promised=Number(row.querySelector("[data-promised]").value)||0;
  row.querySelector("[data-premain]").value=Math.max(0,purchase-promised);
 });
}
async function savePromise(){
 const selected=getSelectedCharacters("promiseCharacterList");
 if(!selected.length){alert("キャラを1人以上選択してね！");return;}

 const purchaseQty=Math.max(0,Number(document.getElementById("promisePurchaseQty").value)||0);
 const rows=[...document.querySelectorAll("#promiseDetail .promise-row")];

 const characters=selected.map((c,i)=>{
  const promised=Math.max(0,Number(rows[i]?.querySelector("[data-promised]")?.value)||0);
  return {
   ...c,
   qty:purchaseQty,
   promised,
   remaining:Math.max(0,purchaseQty-promised),
   retrade:Math.max(0,Number(rows[i]?.querySelector("[data-retrade]")?.value)||0)
  };
 });

 const old=promiseData.find(x=>x.id===editingPromiseId);
 let image=old?.image||"";
 const file=document.getElementById("promiseImage").files[0];
 if(file)image=await compressImage(await fileToDataUrl(file));

 const item={
  id:editingPromiseId||uid(),
  type:document.getElementById("promiseType").value,
  image,
  purchaseQty,
  characters
 };

 const index=promiseData.findIndex(x=>x.id===item.id);
 if(index>=0)promiseData[index]=item;
 else promiseData.push(item);

 saveLocal();
 editingPromiseId=null;
 alert("保存したよ！");
 closePromiseForm();
}
function editPromise(id){
 const item=promiseData.find(x=>x.id===id);
 if(!item)return;

 editingPromiseId=id;
 document.getElementById("promiseHome").style.display="none";
 document.getElementById("promiseForm").style.display="block";
 document.getElementById("promiseScreenshot").style.display="none";
 document.getElementById("promiseFormTitle").textContent="仮約束を編集";
 document.getElementById("promiseType").value=item.type;
 document.getElementById("promisePurchaseQty").value=Number(item.purchaseQty??item.characters?.[0]?.qty??0);
 document.getElementById("promiseImage").value="";

 const p=document.getElementById("promiseImagePreview");
 p.src=item.image||"";
 p.style.display=item.image?"block":"none";

 renderCharacterList("promiseCharacterList",(item.characters||[]).map(c=>c.full));
 updatePromiseDetail(item.characters||[]);
}
function deletePromise(id){
 if(!confirm("この仮約束を削除する？"))return;
 promiseData=promiseData.filter(x=>x.id!==id);
 saveLocal();
 renderPromiseList();
}
function renderPromiseList(){
 const box=document.getElementById("promiseList");
 if(!promiseData.length){
  box.innerHTML='<div class="empty">まだ登録がないよ</div>';
  return;
 }

 box.innerHTML=promiseData.map(item=>{
  const purchase=Number(item.purchaseQty??item.characters?.[0]?.qty??0);
  return `<div class="saved">
   <div class="saved-top">
    <div class="saved-type">${escapeHtml(item.type)} <span style="font-size:11px;color:#888">×${purchase}</span></div>
    <div class="saved-actions">
     <button onclick="editPromise('${item.id}')">編集</button>
     <button onclick="deletePromise('${item.id}')">削除</button>
    </div>
   </div>
   ${item.image?`<img src="${item.image}" class="saved-image">`:""}
   <div class="chips">${(item.characters||[]).map(c=>`<span class="chip">${escapeHtml(c.short)} ${Math.max(0,purchase-Number(c.promised||0))}${Number(c.retrade)?` ★${Number(c.retrade)}`:""}</span>`).join("")}</div>
  </div>`;
 }).join("");
}
function showPromiseScreenshot(){
 document.getElementById("promiseHome").style.display="none";
 document.getElementById("promiseForm").style.display="none";
 document.getElementById("promiseScreenshot").style.display="block";
 document.getElementById("promiseScreenshotContent").innerHTML=makeScreenshot(promiseData,"仮約束",true);
}
function closePromiseScreenshot(){
 document.getElementById("promiseScreenshot").style.display="none";
 document.getElementById("promiseHome").style.display="block";
 renderPromiseList();
}

/* 初期化 */
function init(){
 renderMayoiList();
 renderPromiseList();
 renderCharacterList("characterList",[]);
 renderCharacterList("promiseCharacterList",[]);
}
init();
</script>
</body>
</html>
